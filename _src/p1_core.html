<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD.EXE — THE LAST RENDER</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.playing { cursor: none; }
  #view { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #000; }
  #hud {
    position: fixed; left: 14px; top: 12px; margin: 0; padding: 9px 12px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #a7b1af; background: rgba(0, 0, 0, .62); white-space: pre; pointer-events: none;
    display: none; letter-spacing: .02em; border-left: 1px solid #3d4b4a;
  }
  #hud.on { display: block; }
  #hud.err { display: block; color: #e0645a; border-left-color: #a33; }
  #file { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<pre id="hud"></pre>
<input id="file" type="file" accept="audio/*">
<script>
'use strict';
/* ============================================================================
   WORLD.EXE — THE LAST RENDER
   A 30-second procedural music video. Pure code.

   Every pixel and every sample is generated by this file: geometry, particles,
   typography (a dot-matrix font defined as bit patterns), post-processing,
   camera and the complete soundtrack (rendered offline with Web Audio).
   No textures, images, samples, models, libraries or network requests.

   FILE MAP
     0. CONFIG ................ the important tweakable parameters
     1. Core utilities ........ math, easing, seeded RNG, Perlin noise, mat4
     2. Renderer .............. WebGL2 helpers, LineBatch (instanced AA lines),
                                PointBatch, background sky shader
     3. ParticleEngine ........ GPU particles, transform-feedback simulation
     4. SacredGeometryEngine .. rings, polygons, recursive subdivisions
        ConstellationEngine ... nodes/edges; an anamorphic eye hides inside
        EyeGenerator .......... procedural iris / black-hole pupil shader
     5. LSystemWorldTree ...... stochastic parametric 3D L-system + turtle
        SymbolEngine .......... twelve procedurally invented glyphs
     6. GlitchEngine .......... bloom + 10-layer glitch/post chain
        CameraSystem .......... procedural cinematic camera
     7. Soundtrack ............ deterministic offline composition
        AudioEngine ........... playback / seeking / recording stream
        AudioReactiveSystem ... AnalyserNode → smoothed bass / mid / high
     8. TextOverlaySystem ..... dot-matrix typesetting
        RecursionEngine ....... self-similar infinite zoom-out
     9. TimelineController .... updateScene(time): the master score
    10. App ................... loop, input, resize, quality, recording, HUD
   ========================================================================== */

/* ============================================================================
   0. CONFIG
   ========================================================================== */
const CONFIG = {
  seed: 'THE-LAST-RENDER',     // master seed — every system derives from it (?seed=...)
  duration: 30.0,              // length of the film in seconds
  bpm: 120,                    // musical grid; visual events are quantised to it
  loop: true,                  // after the final cut, wait in black and run again
  loopBlack: 2.4,              // seconds of black before WORLD.EXE restarts
  quality: 'high',             // low | medium | high | ultra   (?q=...)
  adaptiveQuality: true,       // lower the render scale if the frame rate drops
  qualities: {
    low:    { scale: 0.62, maxDPR: 1.0,  particles: 8192 },
    medium: { scale: 0.80, maxDPR: 1.25, particles: 16384 },
    high:   { scale: 1.00, maxDPR: 1.5,  particles: 24576 },
    ultra:  { scale: 1.00, maxDPR: 2.0,  particles: 32768 },
  },
  bloom: { threshold: 0.34, knee: 0.30, strength: 0.95 },
  exposure: 1.55,              // tone-mapping exposure
  grain: 0.035,                // film grain amount
  vignette: 0.6,
  scanlines: 0.07,             // base CRT scanline amount (glitch adds more)
  glitchMaster: 1.0,           // multiplier on the whole GlitchEngine (G toggles)
  lineWidth: 1.0,              // global line width multiplier
  audio: {
    volume: 0.9,
    reactivity: 1.0,           // global multiplier on all audio → visual mappings
    attack: 22.0,              // exponential smoothing rate when a band rises (1/s)
    release: 5.5,              // exponential smoothing rate when a band falls (1/s)
    bands: { bass: [25, 150], mid: [150, 2000], high: [2000, 11000] },
    // BASS → camera shake, scale pulse, particle force
    bassShake: 0.016, bassScale: 0.035, bassForce: 0.9,
    // MID → geometry rotation, tree growth, orbital motion
    midRotation: 0.8, midGrowth: 0.35, midOrbit: 0.8,
    // HIGH → glitch, spark particles, line brightness
    highGlitch: 0.10, highSparks: 140, highBrightness: 0.45,
  },
  palette: {                   // sRGB; converted to linear light below
    bg:    [0.010, 0.011, 0.013],
    white: [0.93, 0.91, 0.86],   // off-white, like old phosphor / paper
    gray:  [0.56, 0.58, 0.58],
    cyan:  [0.43, 0.64, 0.63],   // dirty cyan
    red:   [0.93, 0.19, 0.13],   // warning red — used almost never
  },
};

/* URL overrides: ?seed=ABC  ?q=low|medium|high|ultra  ?t=12.5 (start time)
   ?still=1 (render one frame at t and stop — used for testing)  ?mute=1 */
const QS = new URLSearchParams(location.search);
if (QS.has('seed')) CONFIG.seed = QS.get('seed');
if (QS.has('q') && CONFIG.qualities[QS.get('q')]) CONFIG.quality = QS.get('q');
const START_T = QS.has('t') ? Math.max(0, parseFloat(QS.get('t')) || 0) : 0;
const STILL = QS.has('still');

/* ============================================================================
   1. CORE UTILITIES
   ========================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const smoothstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
/** local progress of t inside [a, b], clamped to 0..1 */
const seg = (t, a, b) => clamp01((t - a) / (b - a));
/** 1 inside [a,b] with smooth fade-in/out edges */
const pulse = (t, a, b, fi, fo) => smoothstep(a, a + fi, t) * (1 - smoothstep(b - fo, b, t));
const Ease = {
  inQuad: t => t * t,
  outQuad: t => t * (2 - t),
  inOutQuad: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inQuart: t => t * t * t * t,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inOutQuint: t => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

/* ---- deterministic hashing / seeded random --------------------------------
   Everything random in this film comes from the master seed.  Systems take a
   forked RNG (makeRNG('tree') etc.) so adding randomness to one system never
   changes another.  Per-frame randomness (glitch) uses rand1(integer) which is
   a pure function of the timeline frame index — the same time always glitches
   the same way. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hash32(a) {
  a = (a ^ 61) ^ (a >>> 16); a = (a + (a << 3)) | 0; a ^= a >>> 4;
  a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15;
  return a >>> 0;
}
const SEED = hashStr(String(CONFIG.seed));
/** deterministic float in [0,1) from an integer (and optional salt) */
const rand1 = (n, salt = 0) => hash32((Math.floor(n) * 2654435761) ^ hash32(SEED + salt * 7919)) / 4294967296;

class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
  next() { // mulberry32
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  sign() { return this.next() < 0.5 ? -1 : 1; }
  gauss() { let u = 0; while (u === 0) u = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * this.next()); }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
}
const makeRNG = label => new RNG(hash32(SEED ^ hashStr(label)));

/* ---- Perlin "improved" noise (seeded permutation) -------------------------- */
class Noise {
  constructor(rng) {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(rng.next() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    this.P = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.P[i] = p[i & 255];
  }
  static fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  static grad(h, x, y, z) {
    const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise3(x, y, z) {
    const P = this.P;
    let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
    const u = Noise.fade(x), v = Noise.fade(y), w = Noise.fade(z), g = Noise.grad;
    const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
    return lerp(
      lerp(lerp(g(P[AA] & 15, x, y, z), g(P[BA] & 15, x - 1, y, z), u),
           lerp(g(P[AB] & 15, x, y - 1, z), g(P[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(g(P[AA + 1] & 15, x, y, z - 1), g(P[BA + 1] & 15, x - 1, y, z - 1), u),
           lerp(g(P[AB + 1] & 15, x, y - 1, z - 1), g(P[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  }
  n1(x, salt = 0) { return this.noise3(x, salt * 1.731 + 0.37, salt * 0.917 + 0.71); }
}

/* ---- tiny vec3 / mat4 (column-major, WebGL convention) --------------------- */
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  /** rotate v around unit axis k by angle (Rodrigues) */
  rot: (v, k, ang) => {
    const c = Math.cos(ang), s = Math.sin(ang), d = k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
    const cx = k[1] * v[2] - k[2] * v[1], cy = k[2] * v[0] - k[0] * v[2], cz = k[0] * v[1] - k[1] * v[0];
    return [v[0] * c + cx * s + k[0] * d * (1 - c), v[1] * c + cy * s + k[1] * d * (1 - c), v[2] * c + cz * s + k[2] * d * (1 - c)];
  },
};
const M4 = {
  perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0); out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
    return out;
  },
  ortho(out, l, r, b, t, n, f) {
    out.fill(0);
    out[0] = 2 / (r - l); out[5] = 2 / (t - b); out[10] = -2 / (f - n);
    out[12] = -(r + l) / (r - l); out[13] = -(t + b) / (t - b); out[14] = -(f + n) / (f - n); out[15] = 1;
    return out;
  },
  identity(out) { out.fill(0); out[0] = out[5] = out[10] = out[15] = 1; return out; },
  /** view matrix + returns basis vectors (right, up, back) into `basis` */
  lookAt(out, eye, target, up, basis) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
    if (basis) { basis.right = [xx, xy, xz]; basis.up = [yx, yy, yz]; basis.fwd = [-zx, -zy, -zz]; }
    return out;
  },
};

/* ---- palette in linear light ---------------------------------------------- */
const toLin = c => c.map(v => Math.pow(v, 2.2));
const PAL = {};
for (const k in CONFIG.palette) PAL[k] = toLin(CONFIG.palette[k]);

/* point sprite shapes */
const SH_SOFT = 0, SH_SQUARE = 1, SH_RING = 2, SH_GLINT = 3;
