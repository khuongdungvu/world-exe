      L.arc(0, 0, 0, R - sz * 1.5, Math.PI / 2, Math.PI / 2 - TAU * rp, 240, G[0] * I, G[1] * I, G[2] * I, 0.9);
      L.arc(0, 0, 0, R + sz * 1.62, Math.PI / 2, Math.PI / 2 - TAU * rp, 300, G[0] * I * 0.5, G[1] * I * 0.5, G[2] * I * 0.5, 0.8);
      for (let k = 0; k < 72; k++) {
        if (k / 72 > rp) break;
        const a = Math.PI / 2 - k / 72 * TAU + A.rot, r0 = R + sz * 1.5, r1 = r0 + (k % 6 === 3 ? sz * 0.45 : sz * 0.12);
        L.seg(Math.cos(a) * r0, Math.sin(a) * r0, 0, Math.cos(a) * r1, Math.sin(a) * r1, 0, G[0] * I, G[1] * I, G[2] * I, 0.8);
      }
    }
    for (let k = 0; k < 12; k++) {
      const pr = A.pr[k];
      if (pr <= 0) continue;
      const ang = Math.PI / 2 - k * TAU / 12 + A.rot;
      let cx = Math.cos(ang) * R, cy = Math.sin(ang) * R;
      if (A.shatter > 0) {
        const s = A.shatter * (0.5 + rand1(k, 21));
        cx += Math.cos(ang) * s * 2 + (rand1(k, 22) - 0.5) * s; cy += Math.sin(ang) * s * 2 + (rand1(k, 23) - 0.5) * s;
      }
      const sc = sz * (1 + 0.22 * A.pulse);
      let I = al * (0.7 + 1.7 * A.pulse) * (1 + (1 - pr) * 1.5);
      if (A.flicker > 0 && rand1(k + A.seed * 13, 24) < A.flicker) I *= 0.08;
      L.arc(cx, cy, 0, sc * 1.25, ang + Math.PI, ang + Math.PI + TAU * pr, 44, G[0] * I * 0.36, G[1] * I * 0.36, G[2] * I * 0.36, 0.9);
      this.drawGlyph(L, k, cx, cy, 0, sc * 0.9, pr, W[0] * I * 0.85, W[1] * I * 0.85, W[2] * I * 0.85, 1.2);
      if (pr >= 1) {
        const J = I * 0.12;
        L.seg(Math.cos(ang) * (R - sz * 1.5), Math.sin(ang) * (R - sz * 1.5), 0, Math.cos(ang) * R * 0.18, Math.sin(ang) * R * 0.18, 0, G[0] * J, G[1] * J, G[2] * J, 0.7);
        P.pt(cx, cy, 0, W[0] * I * 0.5, W[1] * I * 0.5, W[2] * I * 0.5, 2.0 + 3 * A.pulse, SH_SOFT);
      }
    }
  }
}
/* ============================================================================
   6a. GLITCH ENGINE  (post-processing chain)
   scene (HDR) → bright pass → 3-level separable Gaussian bloom → composite.
   One control variable, glitchAmount (0 = pristine … 1 = reality failing),
   drives every layer.  All randomness is a pure function of the timeline
   (a 24 Hz "glitch clock"), so the same moment always breaks the same way.

     1 RGB channel offset        6 random geometry corruption (in the batches)
     2 horizontal tearing        7 brightness spikes / inversion / posterize
     3 scanlines + interlace     8 frame skipping + vertical roll
     4 temporal frame echo       9 particle explosions (in the ParticleEngine)
     5 pixel (macro-block) displacement + datamosh from the previous frame

   Layers 6 and 9 live in other systems but read the same glitchAmount.
   The composite also owns tone mapping, grain, vignette, the freeze-frame
   "sweep line", and the final eyelid that closes on the viewer.
   ========================================================================== */
const BRIGHT_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uThr, uKnee;
void main(){
  vec3 c = (texture(uTex, vUv + uTexel * vec2(-0.5, -0.5)).rgb + texture(uTex, vUv + uTexel * vec2(0.5, -0.5)).rgb
          + texture(uTex, vUv + uTexel * vec2(-0.5, 0.5)).rgb + texture(uTex, vUv + uTexel * vec2(0.5, 0.5)).rgb) * 0.25;
  c = min(c, vec3(48.0));
  float l = max(c.r, max(c.g, c.b));
  float s = clamp(l - uThr + uKnee, 0.0, 2.0 * uKnee);
  s = s * s / (4.0 * uKnee + 1e-4);
  o = vec4(c * max(s, l - uThr) / max(l, 1e-4), 1.0);
}`;
const DOWN_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uTexel;
void main(){
  o = vec4((texture(uTex, vUv + uTexel * vec2(-0.5, -0.5)).rgb + texture(uTex, vUv + uTexel * vec2(0.5, -0.5)).rgb
          + texture(uTex, vUv + uTexel * vec2(-0.5, 0.5)).rgb + texture(uTex, vUv + uTexel * vec2(0.5, 0.5)).rgb) * 0.25, 1.0);
}`;
const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  vec3 c = texture(uTex, vUv).rgb * 0.2270270;
  c += (texture(uTex, vUv + uDir * 1.3846154).rgb + texture(uTex, vUv - uDir * 1.3846154).rgb) * 0.3162162;
  c += (texture(uTex, vUv + uDir * 3.2307692).rgb + texture(uTex, vUv - uDir * 3.2307692).rgb) * 0.0702703;
  o = vec4(c, 1.0);
}`;
const COPY_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uTex;
void main(){ o = vec4(texture(uTex, vUv).rgb, 1.0); }`;
const COMPOSITE_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform sampler2D uScene, uBloomA, uBloomB, uBloomC, uHist;
uniform vec2 uRes;
uniform float uTime, uRnd, uG, uRGB, uTear, uBands, uBlock, uBlockPx, uEcho, uEchoZoom, uSpike, uInvert, uQuant;
uniform float uScan, uRoll, uGrain, uGrainSeed, uVig, uExposure, uBlack, uLid, uBloomStr, uDesat, uSweep, uSweepY;
uniform float uInterlace, uMosh, uWarp;
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
vec3 tonemap(vec3 c){ c = 1.0 - exp(-max(c, 0.0) * uExposure); return pow(c, vec3(1.0 / 2.2)); }
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec2 d0 = vUv - 0.5;
  vec2 uv = 0.5 + d0 * (1.0 + uWarp * dot(d0, d0) * 2.0);            // lens warp
  uv.y = fract(uv.y + uRoll);                                        // 8 vertical roll
  float band = floor(uv.y * uBands);                                 // 2 horizontal tearing
  float tear = 0.0;
  if (h21(vec2(band, floor(uRnd * 977.0))) < 0.15 + 0.45 * uG) tear = (h21(vec2(band * 1.7 + 3.0, floor(uRnd * 613.0))) - 0.5) * uTear;
  tear += sin(uv.y * 31.0 + uTime * 47.0) * uTear * 0.035;
  tear += (mod(floor(fc.y), 2.0) - 0.5) * uInterlace;                // 3 interlace
  uv.x += tear;
  vec2 bc = floor(fc / uBlockPx);                                    // 5 macro-block displacement
  bool blk = h21(bc + floor(uRnd * 389.0)) < uBlock;
  vec2 suv = uv;
  if (blk) suv += (vec2(h21(bc + 1.3 + floor(uRnd * 211.0)), h21(bc + 7.1 + floor(uRnd * 157.0))) - 0.5) * vec2(0.16, 0.05) * (0.4 + uG);
  vec2 dc = suv - 0.5;                                               // 1 RGB channel offset
  vec2 ca = vec2(uRGB, uRGB * 0.2) + dc * (0.0025 + uRGB * 0.5) * length(dc) * 2.0;
  vec3 c = vec3(texture(uScene, suv + ca).r, texture(uScene, suv).g, texture(uScene, suv - ca).b);
  c += (texture(uBloomA, suv).rgb * 0.5 + texture(uBloomB, suv).rgb * 0.75 + texture(uBloomC, suv).rgb * 0.9) * uBloomStr;
  c *= 1.0 + uSpike;                                                 // 7 brightness spikes
  c = tonemap(c);
  vec2 huv = (vUv - 0.5) * uEchoZoom + 0.5 + vec2(tear * 0.6, 0.0);  // 4 temporal echo
  vec3 hist = texture(uHist, huv).rgb;
  c = max(c, hist * uEcho);
  if (blk && h21(bc + 9.7 + floor(uRnd * 83.0)) < uMosh) c = texture(uHist, suv).rgb * 0.96;  // datamosh
  c = mix(c, vec3(dot(c, vec3(0.299, 0.587, 0.114))), uDesat);
  if (uQuant > 1.0) c = floor(c * uQuant + 0.5) / uQuant;            // 7 posterize
  c *= 1.0 - uScan * (0.5 + 0.5 * cos(fc.y * 2.0943951));            // 3 scanlines
  if (uSweep > 0.0) c += vec3(0.55, 0.62, 0.62) * exp(-abs(vUv.y - uSweepY) * uRes.y * 0.6) * uSweep;
  c += (h21(fc + vec2(uGrainSeed * 37.0, uGrainSeed * 91.0)) - 0.5) * uGrain;
  c *= 1.0 - uVig * dot(d0, d0) * 1.3;
  if (uInvert > 0.5) c = vec3(1.0) - c;
  if (uLid > 0.0) {                                                  // the eyelid that closes on the viewer
    vec2 q = d0 * 2.0; q.x /= 1.25;
    float h = max(1.6 * (1.0 - uLid), 1e-3);
    float R = (1.0 + h * h) / (2.0 * h), cc = R - h;
    float lid = max(length(q - vec2(0.0, -cc)) - R, length(q - vec2(0.0, cc)) - R);
    c *= 1.0 - smoothstep(-0.02, 0.02, lid);
  }
  c *= 1.0 - uBlack;
  o = vec4(max(c, 0.0), 1.0);
}`;

class GlitchEngine {
  constructor(r) {
    this.r = r;
    this.pBright = r.program(FULLSCREEN_VS, BRIGHT_FS);
    this.pDown = r.program(FULLSCREEN_VS, DOWN_FS);
    this.pBlur = r.program(FULLSCREEN_VS, BLUR_FS);
    this.pComp = r.program(FULLSCREEN_VS, COMPOSITE_FS);
    this.pCopy = r.program(FULLSCREEN_VS, COPY_FS);
    this.scene = r.target(4, 4, { depth: true });
    this.bloom = [0, 1, 2].map(() => [r.target(2, 2), r.target(2, 2)]);   // half, quarter, eighth
    this.hist = [r.target(4, 4, { hdr: false }), r.target(4, 4, { hdr: false })];
    this.hi = 0;
    this.enabled = true;       // G key
    this.glitchAmount = 0;     // the control variable (after master / toggle)
    this.P = {};
  }
  resize(w, h) {
    const r = this.r, gl = r.gl;
    r.resizeTarget(this.scene, w, h);
    this.bloom.forEach((pair, i) => pair.forEach(t => r.resizeTarget(t, w >> (i + 1), h >> (i + 1))));
    this.hist.forEach(t => { r.resizeTarget(t, w, h); r.bind(t); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); });
  }
  clearHistory() {
    const gl = this.r.gl;
    this.hist.forEach(t => { this.r.bind(t); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); });
  }
  /** Derive every layer from glitchAmount.  X = scene-driven extras
      { echo, echoZoom, black, lid, desat, sweep, sweepY, warp, flash, exposure, grainSeed, oneFrame } */
  compute(T, g, X) {
    const P = this.P;
    g = this.enabled ? clamp(g * CONFIG.glitchMaster, 0, 1.5) : 0;
    this.glitchAmount = g;
    const f = Math.floor(T * 24), r = k => rand1(f, 100 + k);
    P.time = T; P.g = g; P.rnd = r(0);
    P.rgb = 0.0005 + g * (0.003 + 0.022 * Math.pow(r(1), 3));
    P.tear = g * g * (r(2) < 0.25 + 0.6 * g ? 0.02 + 0.14 * r(3) : 0.004);
    P.bands = 6 + Math.floor(r(4) * 60);
    P.scan = CONFIG.scanlines + g * 0.3;
    P.echo = clamp(Math.max(X.echo || 0, g * 0.82), 0, 0.97);
    P.echoZoom = X.echoZoom || (1 - g * 0.012 * (r(5) - 0.3));
    P.block = g > 0.15 ? (g - 0.15) * 0.4 * (r(6) < 0.6 ? 1 : 0.2) : 0;
    P.blockPx = [16, 24, 32, 48, 64][Math.floor(r(7) * 5)] * this.scene.h / 1080;
    P.mosh = g > 0.4 ? 0.6 : 0;
    P.spike = (r(8) < g * 0.16 ? 0.8 + 2.5 * r(9) : 0) + (X.flash || 0);
    P.invert = g > 0.55 && r(10) < (g - 0.5) * 0.14 ? 1 : 0;
    P.quant = g > 0.6 && r(11) < 0.25 ? 3 + Math.floor(r(12) * 5) : 0;
    P.roll = g > 0.7 && r(13) < 0.12 ? r(14) : 0;
    P.interlace = g * 0.004;
    P.warp = (X.warp || 0) + g * 0.25 * (r(15) - 0.5);
    P.skip = g > 0.25 && r(16) < (g - 0.2) * 0.3;          // 8 frame skipping (executed by the App)
    if (X.oneFrame && this.enabled) {                       // the blink: the whole scene distorts for one frame
      P.tear = 0.2; P.bands = 11; P.rgb = 0.03; P.warp = 0.9; P.block = 0.3; P.spike = 1.2; P.g = 1; P.mosh = 0; P.skip = false;
    }
    P.grain = CONFIG.grain * (1 + g * 2.5);
    P.grainSeed = X.grainSeed || 0;
    P.vig = CONFIG.vignette;
    P.exposure = CONFIG.exposure * (X.exposure === undefined ? 1 : X.exposure);
    P.black = X.black || 0; P.lid = X.lid || 0; P.desat = X.desat || 0;
    P.sweep = X.sweep || 0; P.sweepY = X.sweepY || 0;
    P.bloomStr = CONFIG.bloom.strength * (1 + g * 0.6);
    return P;
  }
  blur(src, dst, dx, dy) {
    const r = this.r, gl = r.gl, u = this.pBlur.u;
    r.bind(dst);
    gl.useProgram(this.pBlur.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.tex);
    gl.uniform1i(u.uTex, 0);
    gl.uniform2f(u.uDir, dx / src.w, dy / src.h);
    r.fullscreen();
  }
  render(P) {
    const r = this.r, gl = r.gl, S = this.scene, B = this.bloom;
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    // bright pass → half res
    r.bind(B[0][0]);
    gl.useProgram(this.pBright.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.tex);
    gl.uniform1i(this.pBright.u.uTex, 0);
    gl.uniform2f(this.pBright.u.uTexel, 1 / S.w, 1 / S.h);
    gl.uniform1f(this.pBright.u.uThr, CONFIG.bloom.threshold);
    gl.uniform1f(this.pBright.u.uKnee, CONFIG.bloom.knee);
    r.fullscreen();
    this.blur(B[0][0], B[0][1], 1, 0); this.blur(B[0][1], B[0][0], 0, 1);
    for (let i = 1; i < 3; i++) {                    // quarter, eighth
      r.bind(B[i][0]);
      gl.useProgram(this.pDown.p);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, B[i - 1][0].tex);
      gl.uniform1i(this.pDown.u.uTex, 0);
      gl.uniform2f(this.pDown.u.uTexel, 1 / B[i - 1][0].w, 1 / B[i - 1][0].h);
      r.fullscreen();
      this.blur(B[i][0], B[i][1], 1, 0); this.blur(B[i][1], B[i][0], 0, 1);
    }
    // composite (reads the previous output for echo / datamosh)
    const src = this.hist[this.hi], dst = this.hist[1 - this.hi], u = this.pComp.u;
    r.bind(dst);
    gl.useProgram(this.pComp.p);
    const tex = [S.tex, B[0][0].tex, B[1][0].tex, B[2][0].tex, src.tex];
    const names = ['uScene', 'uBloomA', 'uBloomB', 'uBloomC', 'uHist'];
    for (let i = 0; i < 5; i++) { gl.activeTexture(gl.TEXTURE0 + i); gl.bindTexture(gl.TEXTURE_2D, tex[i]); gl.uniform1i(u[names[i]], i); }
    gl.uniform2f(u.uRes, S.w, S.h);
    gl.uniform1f(u.uTime, P.time); gl.uniform1f(u.uRnd, P.rnd); gl.uniform1f(u.uG, P.g);
    gl.uniform1f(u.uRGB, P.rgb); gl.uniform1f(u.uTear, P.tear); gl.uniform1f(u.uBands, P.bands);
    gl.uniform1f(u.uBlock, P.block); gl.uniform1f(u.uBlockPx, Math.max(4, P.blockPx));
    gl.uniform1f(u.uEcho, P.echo); gl.uniform1f(u.uEchoZoom, P.echoZoom);
    gl.uniform1f(u.uSpike, P.spike); gl.uniform1f(u.uInvert, P.invert); gl.uniform1f(u.uQuant, P.quant);
    gl.uniform1f(u.uScan, P.scan); gl.uniform1f(u.uRoll, P.roll);
    gl.uniform1f(u.uGrain, P.grain); gl.uniform1f(u.uGrainSeed, P.grainSeed);
    gl.uniform1f(u.uVig, P.vig); gl.uniform1f(u.uExposure, P.exposure);
    gl.uniform1f(u.uBlack, P.black); gl.uniform1f(u.uLid, P.lid); gl.uniform1f(u.uBloomStr, P.bloomStr);
    gl.uniform1f(u.uDesat, P.desat); gl.uniform1f(u.uSweep, P.sweep); gl.uniform1f(u.uSweepY, P.sweepY);
    gl.uniform1f(u.uInterlace, P.interlace); gl.uniform1f(u.uMosh, P.mosh); gl.uniform1f(u.uWarp, P.warp);
    r.fullscreen();
    gl.activeTexture(gl.TEXTURE0);
    this.hi = 1 - this.hi;
    this.present();
  }
  /** show the most recent composite (also used to hold a frame when skipping) */
  present() {
    const r = this.r, gl = r.gl;
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
    r.bind(null);
    gl.useProgram(this.pCopy.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.hist[this.hi].tex);
    gl.uniform1i(this.pCopy.u.uTex, 0);
    r.fullscreen();
  }
}

/* ============================================================================
   6b. CAMERA SYSTEM
   A procedural camera with three "spaces" joined through darkness:
     A (0–8 s)   on the axis of the mandala: almost static → slow push →
                 exponential dive into the pupil (with a slow roll).
     B (8–24 s)  the tree world: a Catmull-Rom helix that rises through the
                 structure and pulls back for the wheel of symbols; a hard
                 freeze; a subtle orbit around the giant eye; then an unstable
                 hand that jolts, rolls and pumps its focal length.
     C (24–30 s) a fixed plate camera — the recursive zoom-out is done in
                 double precision on the CPU, not by moving this camera.
   Shake is smooth noise scaled by BASS, plus the glitch section's jolts.
   ========================================================================== */
const EYE_DIST = 4.0;      // distance from the frozen camera to the giant eye
const EYE_SCALE = 1.3;     // world units per eye unit (Space B)
class CameraSystem {
  constructor(noise) {
    this.noise = noise;
    this.pos = [0, 0, 3]; this.target = [0, 0, 0];
    this.fov = 40 * DEG; this.near = 0.01; this.far = 400; this.roll = 0; this.aspect = 16 / 9;
    this.view = new Float32Array(16); this.proj = new Float32Array(16);
    this.basis = { right: [1, 0, 0], up: [0, 1, 0], fwd: [0, 0, -1] };
    this.tanHalf = Math.tan(this.fov / 2);
    // [time, position, look-at] — the path through the world tree
    this.keys = [
      [8.0,  [0.0, 0.35, 6.2],  [0, 0.5, 0]],
      [9.0,  [0.9, 1.0, 7.6],   [0, 1.9, 0]],
      [10.0, [2.4, 2.3, 8.6],   [0, 3.6, 0]],
      [11.0, [3.9, 3.9, 6.4],   [0, 5.0, 0]],
      [12.0, [3.1, 5.5, 4.4],   [0, 6.1, 0]],
      [13.0, [4.2, 7.0, 9.0],   [0, 6.3, 0]],
      [14.0, [4.6, 7.4, 10.6],  [0, 6.3, 0]],
    ];
    // the frozen pose (t = 14) defines where the giant eye will later form
    const p = this.treePose(14.0), fwd = V3.norm(V3.sub(p.target, p.pos));
    const right = V3.norm(V3.cross(fwd, [0, 1, 0])), up = V3.cross(right, fwd);
    this.frozen = { pos: p.pos, target: p.target, fwd, right, up };
    const o = V3.add(p.pos, V3.scale(fwd, EYE_DIST));
    this.eye = { o, right, up, back: V3.scale(fwd, -1),
      x: V3.scale(right, EYE_SCALE), y: V3.scale(up, EYE_SCALE), z: V3.scale(fwd, -EYE_SCALE) };
    this.treeFov = 46 * DEG;
  }
  static cr(p0, p1, p2, p3, t) {   // uniform Catmull-Rom
    const t2 = t * t, t3 = t2 * t, out = [0, 0, 0];
    for (let i = 0; i < 3; i++)
      out[i] = 0.5 * ((2 * p1[i]) + (-p0[i] + p2[i]) * t + (2 * p0[i] - 5 * p1[i] + 4 * p2[i] - p3[i]) * t2 + (-p0[i] + 3 * p1[i] - 3 * p2[i] + p3[i]) * t3);
    return out;
  }
  treePose(T) {
    const K = this.keys, n = K.length;
    const t = clamp(T, K[0][0], K[n - 1][0] - 1e-6);
    let i = 0;
    while (i < n - 2 && t >= K[i + 1][0]) i++;
    const u = (t - K[i][0]) / (K[i + 1][0] - K[i][0]);
    const a = K[Math.max(0, i - 1)], b = K[i], c = K[i + 1], d = K[Math.min(n - 1, i + 2)];
    return { pos: CameraSystem.cr(a[1], b[1], c[1], d[1], u), target: CameraSystem.cr(a[2], b[2], c[2], d[2], u) };
  }
  /** S: { shake, glitch } */
  update(T, S) {
    let roll = 0;
    if (T < 8.0) {                                   // ---- SPACE A
      let D;
      if (T < 4) D = 3.05 - 0.0125 * T;                                   // almost static
      else if (T < 7) D = lerp(3.0, 2.45, Ease.inOutQuad(seg(T, 4, 7))); // slow zoom forward
      else D = 2.45 * Math.pow(0.02, Math.pow(seg(T, 7.0, 8.0), 1.5));   // the dive
      this.pos = [0, 0, D]; this.target = [0, 0, 0];
      this.fov = 40 * DEG;
      roll = 0.5 * Ease.inCubic(seg(T, 7.0, 8.0));
    } else if (T < 24.0) {                           // ---- SPACE B
      this.fov = this.treeFov;
      if (T < 14.0) { const p = this.treePose(T); this.pos = p.pos; this.target = p.target; }
      else if (T < 18.0) { this.pos = this.frozen.pos.slice(); this.target = this.frozen.target.slice(); }
      else {
        const F = this.frozen, E = this.eye.o;
        const yaw = 0.2 * Ease.inOutQuad(seg(T, 18.0, 20.8)), pitch = 0.05 * Math.sin((T - 18) * 1.1);
        let dist = lerp(EYE_DIST, 3.5, Ease.inOutCubic(seg(T, 18.0, 21.0)));
        let off = V3.scale(F.fwd, -1);
        off = V3.rot(off, F.up, yaw);
        off = V3.rot(off, F.right, pitch);
        let tgt = E.slice();
        if (T >= 21.0) {                             // unstable: jolts, roll, focal pumping, pull-back
          const g = clamp01(S.glitch || 0), j = Math.floor(T * 12), q = k => rand1(j, 40 + k) - 0.5;
          dist += 2.6 * Ease.inOutCubic(seg(T, 21.8, 23.2));
          off = V3.rot(off, F.up, q(1) * 0.22 * g);
          off = V3.rot(off, F.right, q(2) * 0.12 * g);
          tgt = V3.add(tgt, V3.add(V3.scale(F.right, q(3) * 0.5 * g), V3.scale(F.up, q(4) * 0.3 * g)));
          roll = q(5) * 0.16 * g;
          this.fov = (46 + q(6) * 26 * g) * DEG;
        }
        this.pos = V3.add(E, V3.scale(off, dist));
        this.target = tgt;
      }
    } else {                                         // ---- SPACE C
      this.pos = [0, 0, 3]; this.target = [0, 0, 0]; this.fov = 40 * DEG;
    }
    // orthonormal basis, roll, and smooth (noise) shake proportional to distance
    const fwd = V3.norm(V3.sub(this.target, this.pos));
    const r0 = V3.norm(V3.cross(fwd, Math.abs(fwd[1]) > 0.999 ? [0, 0, 1] : [0, 1, 0])), u0 = V3.cross(r0, fwd);
    const sh = S.shake || 0;
    if (sh > 0) {
      const d = V3.len(V3.sub(this.target, this.pos)), n = this.noise, f = S.shakeFreq || 7;
      const ox = n.n1(T * f, 1) * sh * d, oy = n.n1(T * f, 2) * sh * d;
      this.target = V3.add(this.target, V3.add(V3.scale(r0, ox), V3.scale(u0, oy)));
      this.pos = V3.add(this.pos, V3.add(V3.scale(r0, ox * 0.3), V3.scale(u0, oy * 0.3)));
      roll += n.n1(T * f * 0.7, 3) * sh * 0.6;
    }
    this.roll = roll;
    const up = V3.add(V3.scale(u0, Math.cos(roll)), V3.scale(r0, Math.sin(roll)));
    M4.lookAt(this.view, this.pos, this.target, up, this.basis);
    M4.perspective(this.proj, this.fov, this.aspect, this.near, this.far);
    this.tanHalf = Math.tan(this.fov / 2);
  }
}

/* ============================================================================
   7a. SOUNDTRACK
   A deterministic 30-second score, rendered offline (OfflineAudioContext) from
   oscillators, FM bells, filtered noise and saw pads on the film's 120 BPM
   grid.  Rendering into one buffer makes pause, seek and loop sample-exact.
   Section gates perform the hard cuts written into the score: 14 s (freeze),
   20 s (ERROR), 24 s (blackout), 30 s (end).
   ========================================================================== */
const NOTE = m => 440 * Math.pow(2, (m - 69) / 12);
class Soundtrack {
  static render(sr = 44100) {
    const ctx = new OfflineAudioContext(2, Math.ceil((CONFIG.duration + 0.6) * sr), sr);
    new Soundtrack(ctx).compose();
    return ctx.startRendering();
  }
  constructor(c) {
    this.c = c; this.rng = makeRNG('soundtrack');
    const r = this.rng, sr = c.sampleRate;
    this.noiseBuf = c.createBuffer(1, sr * 2, sr);
    const nd = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = r.next() * 2 - 1;
    this.crushBuf = c.createBuffer(1, sr, sr);          // sample-and-hold 2-bit "digital debris"
    const cd = this.crushBuf.getChannelData(0);
    for (let i = 0, hold = 0, v = 0; i < cd.length; i++) {
      if (--hold <= 0) { hold = 1 + Math.floor(r.next() * 40); v = Math.round((r.next() * 2 - 1) * 3) / 3; }
      cd[i] = v;
    }
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
    comp.connect(c.destination);
    this.master = c.createGain(); this.master.connect(comp);
    this.musicGate = c.createGain(); this.musicGate.connect(this.master);
    this.music = c.createGain(); this.music.connect(this.musicGate);
    const verb = c.createConvolver(), send = c.createGain();
    verb.buffer = this.impulse(2.8); send.gain.value = 0.32;
    this.music.connect(send); send.connect(verb); verb.connect(this.musicGate);  // reverb is gated too: cuts are hard
    this.ui = c.createGain(); this.ui.gain.value = 0.7; this.ui.connect(this.master);
    this.glitchGate = c.createGain(); this.glitchGate.connect(this.master);
    this.gx = c.createGain(); this.gx.connect(this.glitchGate);
    const gate = (p, t, a, b, ramp = 0.006) => { p.setValueAtTime(a, t); p.linearRampToValueAtTime(b, t + ramp); };
    this.master.gain.setValueAtTime(0.8, 0); gate(this.master.gain, 29.3, 0.8, 0, 1.1);   // the ending breathes out instead of being cut
    const M = this.musicGate.gain;

/* ============================================================================
   7b. AUDIO ENGINE — playback of the rendered score (play / stop / seek).
   The analyser taps the source before the volume stage, so muting keeps the
   visuals reactive.
   ========================================================================== */
class AudioEngine {
  constructor() {
    this.ctx = null; this.buffer = null; this.src = null; this.analyser = null;
    this.playing = false; this.startAt = 0; this.muted = QS.has('mute'); this.status = 'composing';
  }
  init() {                                   // must run inside a user gesture (autoplay policy)
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.status = 'no Web Audio'; return; }
    this.ctx = new AC();
    this.out = this.ctx.createGain();
    this.out.gain.value = this.muted ? 0 : CONFIG.audio.volume;
    this.out.connect(this.ctx.destination);
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 2048; this.analyser.smoothingTimeConstant = 0.5;
  }
  play(offset) {
    this.stop();
    if (!this.ctx || !this.buffer) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    offset = Math.max(0, offset);
    if (offset >= this.buffer.duration) return;
    const s = this.ctx.createBufferSource();
    s.buffer = this.buffer; s.connect(this.analyser); s.connect(this.out); s.start(0, offset);
    this.src = s; this.startAt = this.ctx.currentTime - offset; this.playing = true;
  }
  stop() {
    if (this.src) { try { this.src.stop(); } catch (e) { /* already ended */ } this.src.disconnect(); this.src = null; }
    this.playing = false;
  }
  time() { return this.ctx.currentTime - this.startAt - (this.ctx.outputLatency || 0); }
  setMuted(m) { this.muted = m; if (this.out) this.out.gain.value = m ? 0 : CONFIG.audio.volume; }
}

/* ============================================================================
   7c. AUDIO REACTIVE SYSTEM — AnalyserNode → bass / mid / high.
   Band energy is read from the FFT, auto-gained by a slowly decaying peak
   (so any track works), then exponentially smoothed with a fast attack and a
   slower release so the picture never jitters.  A toggles it off; the film is
   then driven by the timeline alone.
   ========================================================================== */
class AudioReactiveSystem {
  constructor() {
    this.enabled = true; this.data = null;
    this.v = { bass: 0, mid: 0, high: 0 };
    this.peak = { bass: 0.3, mid: 0.3, high: 0.3 };
  }
  update(dt, an, sr, active) {
    const A = CONFIG.audio, raw = { bass: 0, mid: 0, high: 0 };
    if (an && active) {
      if (!this.data) this.data = new Uint8Array(an.frequencyBinCount);
      an.getByteFrequencyData(this.data);
      const hz = sr / an.fftSize, d = this.data;
      for (const k in raw) {
        const i0 = Math.max(1, Math.floor(A.bands[k][0] / hz)), i1 = Math.min(d.length - 1, Math.ceil(A.bands[k][1] / hz));
        let s = 0;
        for (let i = i0; i <= i1; i++) s += d[i];
        const x = Math.max(0, s / ((i1 - i0 + 1) * 255) - 0.1) / 0.9;
        this.peak[k] = Math.max(this.peak[k] * Math.exp(-dt * 0.3), x, 0.2);
        raw[k] = clamp01(x / this.peak[k]);
      }
    }
    for (const k in this.v) {
      const target = this.enabled ? raw[k] * A.reactivity : 0, rate = target > this.v[k] ? A.attack : A.release;
      this.v[k] += (target - this.v[k]) * (1 - Math.exp(-dt * rate));
    }
  }
}

const TEXT_CUES = [

class TextOverlaySystem {
  constructor() { this.px = 4; }
  layout(W, H) { this.px = Math.max(2, Math.round(H * 0.0047)); }
  /** one glyph at top-left (x,y); inv = inverted 7×9 block (selection, cursor);
      collect = array → gather pixel centres instead of drawing */
  glyph(P, ch, x, y, px, col, a, collect, inv) {
    const rows = FONT[ch] || FONT['?'], sz = px * 0.84;

        const on = r >= 0 && r < 7 && c >= 0 && c < 5 && (rows[r] & (16 >> c)) !== 0;

      o.corrupt / o.jitter break it.  Returns the next character slot (cursor). */
  block(P, lines, o) {
    const px = this.px, adv = 7 * px, lh = 12 * px;
    const wmax = Math.max(1, ...lines.map(l => l.length)) * adv - 2 * px;

      for (let ci = 0; ci < s.length && budget > 0; ci++, budget--) {
        let ch = s[ci], gx = x0 + ci * adv;
        if (o.corrupt && ch !== ' ' && rand1(li * 97 + ci * 13 + seed * 131, 61) < o.corrupt) ch = GLYPHS[Math.floor(rand1(ci * 7 + seed * 3, 62) * GLYPHS.length)];
        if (o.jitter) gx += (rand1(li * 31 + ci + seed * 17, 63) - 0.5) * o.jitter * px * 6;
        this.glyph(P, ch, gx, gy, px, col, a, o.collect);
        nx = x0 + (ci + 1) * adv; ny = gy;
      }
    }
    return { x: nx, y: ny, x0, y0 };
  }
}

/* ============================================================================
   8b. RECURSION ENGINE — the final pull-back.
   World k+1 holds world k in one of its nodes (the "slot" at p, scale s,
   turned by φ).  Zooming out about the FIXED POINT c = (I − s·R(φ))⁻¹·p of
   that similarity makes every level identical at integer zoom u: an endless
   regress.  Level transforms reach ~10⁵× scale, so they are composed in
   double precision on the CPU and handed to the batches as 2D similarities.
   ========================================================================== */
class RecursionEngine {
  constructor(geo) {
    this.geo = geo; this.s = 0.075; this.phi = 0.55;
    this.p = [Math.cos(0.62) * 0.64, Math.sin(0.62) * 0.64];
    const cs = Math.cos(this.phi) * this.s, sn = Math.sin(this.phi) * this.s, det = (1 - cs) * (1 - cs) + sn * sn;
    this.c = [((1 - cs) * this.p[0] - sn * this.p[1]) / det, (sn * this.p[0] + (1 - cs) * this.p[1]) / det];
  }
  view(u) {           // level-0 → view: zoom s^u, rotation φu, centre drifting onto the fixed point
    const w = smoothstep(0, 0.85, u);
    return { z: Math.pow(this.s, u), rot: this.phi * u, cx: this.c[0] * w, cy: this.c[1] * w };
  }
  particleXf(u) {     // the same transform for the GPU particles (they live in level-0 space)
    const V = this.view(u), a = V.z * Math.cos(V.rot), b = V.z * Math.sin(V.rot);
    return [a, b, -(a * V.cx - b * V.cy), -(b * V.cx + a * V.cy)];
  }
  draw(L, P, T, u) {
    const V = this.view(u), cr = Math.cos(V.rot), sr = Math.sin(V.rot), s = this.s;
    const cp = Math.cos(-this.phi), sp = Math.sin(-this.phi);
    let zx = 0, zy = 0;   // centre of level k in level-0 coordinates: z_k = R(−φ)(z_{k−1} − p) / s
    for (let k = 0; k <= Math.floor(u) + 2; k++) {
      if (k > 0) { const dx = zx - this.p[0], dy = zy - this.p[1]; zx = (cp * dx - sp * dy) / s; zy = (sp * dx + cp * dy) / s; }
      const sc = Math.pow(s, u - k);
      if (sc < 0.004 || sc > 40) continue;
      const vx = V.z * (cr * (zx - V.cx) - sr * (zy - V.cy)), vy = V.z * (sr * (zx - V.cx) + cr * (zy - V.cy));
      L.setXform2D(vx, vy, sc, this.phi * (u - k));
      P.setXform2D(vx, vy, sc, this.phi * (u - k));
      this.level(L, P, T, k, sc, smoothstep(0.004, 0.03, sc) * (1 - smoothstep(10, 40, sc)) * (k === 0 ? 1 : smoothstep(k - 0.95, k - 0.45, u)));   // a larger world is revealed only when the pull-back reaches it
    }
    L.resetXform(); P.resetXform();
  }
  level(L, P, T, k, sc, al) {
    if (al < 0.003) return;
    const W = PAL.white, G = PAL.gray, geo = this.geo;
    if (k === 0) geo.draw(L, P, T < 28.6 ? 1.0 + (T - 28.0) * 5.1 : 4.06 + (T - 28.6) * 0.6, { alpha: al });   // the world regenerates (fast replay of 1–4 s)
    else if (sc > 0.05) geo.draw(L, P, 4.4 + k * 1.37 + (T - 28) * 0.3, { alpha: al * 0.85, figAlpha: sc > 0.15 ? 0.8 : 0, ringAlpha: i => ((i + k) % 3 === 0 ? 0.25 : 1) });
    else for (const r of [0.38, 0.63, 1.0]) L.arc(0, 0, 0, r, 0, TAU, 48, W[0] * al * 0.5, W[1] * al * 0.5, W[2] * al * 0.5, 1);
    const ga = al * (k === 0 ? smoothstep(28.35, 28.6, T) : 1);
    if (ga < 0.003) return;
    const e = 0.2, h = 0.5, R = (1 + h * h) / (2 * h), c = R - h, th = Math.atan2(c, 1), I = ga * 0.6;   // every world has an eye
    L.arc(0, -c * e, 0, R * e, th, Math.PI - th, 120, W[0] * I, W[1] * I, W[2] * I, 1);
    L.arc(0, c * e, 0, R * e, -th, -(Math.PI - th), 120, W[0] * I, W[1] * I, W[2] * I, 1);
    L.arc(0, 0, 0, 0.42 * e, 0, TAU, 40, W[0] * I, W[1] * I, W[2] * I, 1);
    L.arc(0, 0, 0, 0.16 * e, 0, TAU, 24, W[0] * I * 1.5, W[1] * I * 1.5, W[2] * I * 1.5, 1);
    const sx = this.p[0], sy = this.p[1], rr = this.s * 1.3, J = ga * 0.5;                              // …and a slot holding a smaller world
    L.arc(sx, sy, 0, rr, 0, TAU, 40, G[0] * J, G[1] * J, G[2] * J, 0.9);
    for (let q = 0; q < 4; q++) {
      const a = q * Math.PI / 2;
      L.seg(sx + Math.cos(a) * rr * 1.15, sy + Math.sin(a) * rr * 1.15, 0, sx + Math.cos(a) * rr * 1.7, sy + Math.sin(a) * rr * 1.7, 0, G[0] * J, G[1] * J, G[2] * J, 0.9);
    }
    if (k === 0) P.pt(sx, sy, 0, W[0] * ga * 2, W[1] * ga * 2, W[2] * ga * 2, 3, SH_GLINT);
  }
}

/* ============================================================================
   9. TIMELINE CONTROLLER — updateScene(time) is the master score.
   Each frame it derives, from the timeline time (plus the smoothed audio
   bands), the state of every system: the active "space" (A: mandala and
   constellation, B: the world-tree universe in which the eye later forms,
   C: the terminal and the recursion), camera, geometry, tree growth/decay,
   particle forces and targets, text, glitchAmount and post-processing.
   Scenes hand over through morphs, particles, camera travel and darkness;
   hard cuts happen only where the score demands them (14 s, 24 s, 30 s).
   ========================================================================== */
const SECTIONS = [[0, 'GENESIS'], [4, 'CONSTELLATION'], [8, 'WORLD TREE'], [12, 'TWELVE SIGNS'], [14, 'FREEZE / INIT'],
  [18, 'THE EYE'], [20, 'GOD_PROCESS'], [24, 'RESTART?'], [28, 'RECURSION']];
const EXPLOSIONS = [[18.0, 5], [21.0, 6], [21.45, 4], [21.9, 5], [22.6, 6], [23.2, 8]];

class TimelineController {
  constructor(app) {
    this.a = app; this.prevT = -1; this.X = {};
    this.S = { eyes: [], pu: ParticleEngine.defaults(), post: null, refDist: 3, nebula: 0, glitch: 0 };
    const rng = makeRNG('life'), types = rng.shuffle([0, 1, 2, 3, 4, 5, 6]);
    for (let k = 0; k < 7; k++) {     // seven micro-organisms arranged around the (future) eye
      const ang = -Math.PI / 2 + (k + 0.5) * TAU / 7 + rng.range(-0.15, 0.15);
      this.S.pu.life.set([Math.cos(ang) * 1.2, Math.sin(ang) * 0.64, rng.range(0.1, 0.18), types[k]], k * 4);
    }
  }
  blink(T) { return T < 19.6 ? 0 : T < 19.76 ? Ease.inQuad(seg(T, 19.6, 19.76)) : T < 19.8 ? 1 : 1 - Ease.outCubic(seg(T, 19.8, 19.98)); }
  zoomU(T) { return 3.0 * (0.5 - 0.5 * Math.cos(Math.PI * seg(T, 28.5, 29.7))) + 0.2 * seg(T, 29.5, 30.0); }   // ease in, three worlds out, settle into a slow drift
  /** jump: re-seed the swarm for that moment and let its forces shape it (fixed-step warm-up) */
  seek(T) {
    const a = this.a, U = this.S.pu, zero = { bass: 0, mid: 0, high: 0 };
    this.prevT = T;
    if (T >= 28) this.textToParticles(); else a.particles.reset(T < 8 ? 'stars' : 'tree');
    for (let i = 40; i >= 1; i--) { const t = Math.max(0, T - i / 60); this.particleParams(t, U, zero, 0); a.particles.step(1 / 60, U, t); }
  }
  updateScene(T, dt) {
    const a = this.a, S = this.S, L = a.lines, P = a.points, cam = a.camera, au = a.react.v, AC = CONFIG.audio;
    const fwd = this.prevT >= 0 && T >= this.prevT && T - this.prevT < 0.5;
    const crossed = t => fwd && this.prevT < t && T >= t;
    S.eyes.length = 0;
    // ---- glitchAmount: ~0 in normal scenes, extreme from 21 to 24 s ----
    let g = T > 7.8 && T < 8.05 ? 0.2 : 0;
    if (T >= 20 && T < 24) {
      g = 0.12 + 0.16 * seg(T, 20, 21) + 0.45 * Ease.inQuad(seg(T, 21, 22)) + 0.22 * seg(T, 22, 23) + 0.2 * seg(T, 23, 23.9);
      if (T < 21.5 && rand1(Math.floor(T * 10), 9) < 0.25) g += 0.25;
    }
    if (T < 24 || T >= 28) g += au.high * AC.highGlitch * (g > 0.05 ? 1 : 0.25);         // HIGH → glitch
    const ge = a.glitch.enabled ? g * CONFIG.glitchMaster : 0;
    L.corrupt = P.corrupt = T >= 21 && T < 24 ? ge * 0.9 : 0;                         // layer 6: geometry corruption
    L.corruptScale = P.corruptScale = 0.25;
    L.seed = P.seed = Math.floor(T * 24);
    // ---- camera (BASS → shake) ----
    cam.aspect = a.W / a.H;
    cam.update(T, { shake: au.bass * AC.bassShake * (T < 8 ? 0.35 : 1) + (T >= 21 && T < 24 ? 0.008 * ge : 0), glitch: ge, shakeFreq: 7 });
    if (crossed(8.0)) a.particles.reset('tree');          // through the pupil: a new space
    if (crossed(24.0)) a.glitch.clearHistory();           // hard cut to black
    if (crossed(28.0)) this.textToParticles();            // YES dissolves into the matter of the next world
    const bright = 1 + au.high * AC.highBrightness;       // HIGH → line brightness
    if (T < 8) this.spaceA(T, dt, L, P, au, bright);
    else if (T < 24) this.spaceB(T, L, P, au, bright, ge);
    else if (T < 30) this.spaceC(T, L, P);
    this.particleParams(T, S.pu, au, ge);
    for (const [t, s] of EXPLOSIONS) if (crossed(t)) S.pu.explode = s;   // layer 9: particle explosions
    this.texts(T, ge);
    S.nebula = T < 8 ? 0.012 * smoothstep(4, 6, T) : T < 24 ? 0.05 * smoothstep(8.3, 10, T) * (T < 15 ? 1 : 0.35) : T > 28.4 && T < 30 ? 0.025 : 0;
    // ---- post-processing extras ----
    const X = this.X, fl = (t0, k, amp) => (T >= t0 ? amp * Math.exp(-(T - t0) * k) : 0);
    X.echo = 0.62 * pulse(T, 7.0, 8.05, 0.3, 0.05) + 0.45 * pulse(T, 28.6, 29.75, 0.2, 0.3) + 0.35 * pulse(T, 17.0, 18.2, 0.3, 0.2);
    X.echoZoom = T > 7 && T < 8.05 ? 0.985 : T > 28.6 && T < 29.75 ? 1.012 : T > 17 && T < 18.2 ? 1.006 : 0;
    X.black = T >= 30 ? 1 : Ease.inOutCubic(seg(T, 29.55, 29.98));   // the ending: a slow fade, not a cut
    X.lid = 0;            // (eyelid mask unused: the film fades out instead)
    X.desat = T >= 14 && T < 15 ? 0.4 : T >= 15 && T < 18 ? 0.2 : 0;
    X.sweep = T >= 14 && T < 15 ? 0.9 : 0;
    X.sweepY = 1 - fract((T - 14) * 0.8);
    X.warp = T > 7.4 && T < 8.05 ? 0.12 : 0;
    X.flash = fl(8.0, 7, 0.5) + fl(18.0, 6, 0.7) + (T < 21 ? fl(20.0, 8, 0.5) : 0) + (T < 30 ? fl(28.6, 6, 0.6) : 0);
    X.exposure = 1;
    X.grainSeed = T >= 14 && T < 15 ? 336 : Math.floor(T * 24);   // even the grain freezes
    X.oneFrame = crossed(19.76);                                  // the blink: one distorted frame
    S.post = a.glitch.compute(T, T >= 24 && T < 28 ? 0 : g, X);
    S.glitch = g;
    this.prevT = T;
    return S;
  }
  /* ---- SPACE A (0–8 s): point → ring → rings → sacred geometry → constellation → eye → dive ---- */
  spaceA(T, dt, L, P, au, bright) {
    const a = this.a, geo = a.geo, con = a.con, W = PAL.white;
    this.S.refDist = 3;
    if (T < 1.8) {   // the breathing point
      const br = 0.5 + 0.5 * Math.sin((T - 0.3) * TAU * 0.85);
      const I = smoothstep(0.25, 0.75, T) * (1 - smoothstep(1.05, 1.6, T)) * (1.6 + br * 1.4) * (1 + au.bass);
      P.pt(0, 0, 0, W[0] * I, W[1] * I, W[2] * I, 2.2 + br * 1.6, SH_SOFT);
    }
    geo.audioRot += au.mid * CONFIG.audio.midRotation * dt * 0.3;     // MID → rotation
    const sc = 1 + au.bass * CONFIG.audio.bassScale;                   // BASS → scale pulse
    geo.draw(L, P, T, {
      alpha: 1 - smoothstep(6.7, 7.4, T), figAlpha: 1 - smoothstep(4.0, 4.9, T), dissolve: seg(T, 4.0, 4.9), scale: sc, bright,
      ringAlpha: k => (k === 7 ? lerp(1, 0.22, seg(T, 4.0, 5.0)) : 1 - smoothstep(4.0, 5.0, T)),
    });
    if (T >= 3.4) {
      const theta = T < 6 ? 0.75 - 0.35 * smoothstep(4.0, 6.0, T) + au.mid * 0.04 : lerp(0.4, -4 * Math.PI, Ease.inOutCubic(seg(T, 6.0, 6.92)));
      const aligned = smoothstep(6.6, 6.95, T);
      con.updateA(T, { camD: a.camera.pos[2], theta, tilt: 0.25 * (1 - smoothstep(4.0, 6.9, T)),
        depth: smoothstep(4.0, 5.2, T) * (1 - smoothstep(6.95, 7.35, T)), scale: 1, geoScale: sc });
      con.drawEdges(L, { alpha: smoothstep(4.05, 4.8, T) * (0.8 + aligned * 0.9), maxLen: 1.6 });
      con.drawNodes(P, T, { alpha: 1, bright: bright * (1 + aligned * 0.6), sizeMul: 1 });
    }
    const eI = smoothstep(6.8, 7.3, T);
    if (eI > 0) this.S.eyes.push({ c: [0, 0, 0], u: [1, 0, 0], v: [0, 1, 0], scale: 1, half: [1.12, 0.66], open: 1, iris: 0.42, pupil: 0.16,
      I: eI, red: 0, glitch: 0, hole: 1, sclera: 0.6, time: T, seed: 1 });
  }
  /* ---- SPACE B (8–24 s): tree, signs, freeze, life, consciousness, the eye, ERROR, collapse ---- */
  spaceB(T, L, P, au, bright, g) {
    const a = this.a, cam = a.camera, E = cam.eye, W = PAL.white;
    this.S.refDist = T < 17.9 ? 8 : EYE_DIST;
    let growth = 0.5 * Ease.outCubic(seg(T, 8.05, 9.0));
    for (let b = 0; b < 4; b++) growth += 0.125 * Ease.outQuart(seg(T, 9.0 + b * 0.5, 9.45 + b * 0.5));   // one surge per beat
    if (T < 11) growth = Math.min(1, growth + au.mid * CONFIG.audio.midGrowth * 0.08 * Math.sign(growth)); // MID → growth
    let roots = Ease.outCubic(seg(T, 8.1, 9.6)), neural = Ease.inOutCubic(seg(T, 10.0, 11.6));
    if (T >= 22) {   // decay: the same growth front, reversed and stuttering
      const u = seg(T, 22.0, 23.0);
      growth = u >= 1 ? 0 : 1 - clamp01(Math.floor(Ease.inCubic(u) * 16 + rand1(Math.floor(T * 24), 7) * 0.6) / 16);
      roots = 1 - seg(T, 22.0, 22.9); neural *= 1 - seg(T, 22.0, 22.6);
    }
    let ta = smoothstep(8.0, 8.25, T);
    if (T >= 15) ta = T < 16 ? lerp(1, 0.3, seg(T, 15.0, 15.6)) : lerp(0.3, 0.06, seg(T, 16.0, 17.5));
    if (T >= 21) ta = T < 22 ? (rand1(Math.floor(T * 20), 3) < 0.4 ? 0.5 : 0.1) : 0.95 * (1 - seg(T, 23.0, 23.85));
    a.tree.draw(L, P, { time: T < 14 ? T : T < 22 ? 14 : T, growth, rootGrowth: roots, neural, alpha: ta, decay: T >= 22 ? 1 : 0, sway: 1,
      signals: T >= 10 && T < 22 ? 1 : 0, bright: bright * (1 + au.bass * 0.3), wave: ((Math.min(T, 14) - 8) % 1) * 10 });
    const seedI = smoothstep(8.0, 8.15, T) * (1 - smoothstep(8.8, 9.3, T)) * 2.2;
    if (seedI > 0) P.pt(0, 0.03, 0, W[0] * seedI, W[1] * seedI, W[2] * seedI, 3.2, SH_SOFT);
    // ---- the twelve signs on a wheel around the crown ----
    if (T >= 12.0 && T < 23.0) {
      let al = T < 15 ? 1 : T < 16.6 ? 1 - seg(T, 15.0, 16.6) : 0;
      if (T >= 21) al = (rand1(Math.floor(T * 16), 4) < 0.5 ? 0.7 : 0.15) * (1 - seg(T, 22.3, 23.0));
      if (al > 0) {
        const pr = [];
        for (let k = 0; k < 12; k++) pr.push(Ease.inOutCubic(seg(T, 12.0 + k * 0.075, 12.32 + k * 0.075)));
        let pulseV = 0, rot = 0.03 * Math.min(T, 14);
        for (const tb of [13.0, 13.25, 13.5, 13.75]) {
          if (T >= tb && T < 14) pulseV += Math.exp(-(T - tb) * 9);
          rot -= TAU / 24 * Ease.outCubic(seg(T, tb, tb + 0.2));     // the wheel clicks forward on each hit
        }
        if (T < 14) pulseV = Math.min(1.3, pulseV + au.bass * 0.35);
        const B = T < 14 ? cam.basis : cam.frozen, C = [0, 6.3, 0], back = V3.cross(B.right, B.up);
        L.setXform(C, B.right, B.up, back); P.setXform(C, B.right, B.up, back);
        a.sym.draw(L, P, T, { alpha: al, R: 4.3, size: 0.42, ringPr: Ease.inOutCubic(seg(T, 12.0, 12.95)), pr, pulse: pulseV, rot,
          shatter: T > 21.5 ? (T - 21.5) * 1.2 : 0, flicker: 0, seed: Math.floor(T * 16) });
        L.resetXform(); P.resetXform();
      }
    }
    // ---- the giant eye (shader + halo + constellation + particles) ----
    if (T >= 17.9 && T < 23.9) {
      const open = 1 - this.blink(T);
      let eI = smoothstep(18.0, 18.6, T);
      if (T >= 21) eI *= (1 - seg(T, 21.6, 22.4)) * (rand1(Math.floor(T * 20), 6) < 0.3 + g * 0.4 ? 0.3 : 1);
      if (eI > 0.002) this.S.eyes.push({ c: E.o, u: E.right, v: E.up, scale: EYE_SCALE, half: [1.12, 0.66], open, iris: 0.42,
        pupil: 0.16 * (1 + 0.28 * smoothstep(20.0, 20.5, T)), I: eI, red: smoothstep(20.0, 20.2, T), glitch: g, hole: 1, sclera: 1,
        time: T, seed: Math.floor(T * 24) });
      const ha = smoothstep(18.1, 18.5, T) * (T < 21 ? 1 : 1 - seg(T, 21.3, 22.2));
      if (ha > 0) {
        L.setXform(E.o, E.x, E.y, E.z); P.setXform(E.o, E.x, E.y, E.z);
        a.eye.drawHalo(L, P, T, { alpha: ha * bright, grow: seg(T, 18.1, 19.0), open, spin: 1 + au.mid });
        L.resetXform(); P.resetXform();
      }
      a.con.updateEye(T, E, { open, form: T - 18.0, scatter: T > 21 ? 1.6 * (1 - Math.exp(-(T - 21) * 1.8)) : 0,
        jitter: g * 0.6, depth: 0.12, seed: Math.floor(T * 24) });
      if (T < 23.0) a.con.drawEdges(L, { alpha: smoothstep(18.2, 18.8, T) * 1.1, maxLen: 1.2 });
      else a.con.drawRandomEdges(L, 160, 0.35 * (1 - seg(T, 23.5, 23.85)), Math.floor(T * 30));   // topology collapses
      if (T < 23.85) a.con.drawNodes(P, T, { alpha: 1, bright, sizeMul: 1 });
    }
  }
  /* ---- SPACE C (24–30 s): darkness, the question, rebirth, infinite recursion ---- */
  spaceC(T, L, P) {
    this.S.refDist = 3;
    if (T < 28) return;
    const W = PAL.white; if (T < 28.35) { const I = smoothstep(28.0, 28.08, T) * 2.2; P.pt(0, 0, 0, W[0] * I, W[1] * I, W[2] * I, 3, SH_SOFT); }
    L.alpha = P.alpha = 1 - 0.7 * smoothstep(29.45, 29.9, T);        // the worlds dim ...
    this.a.recursion.draw(L, P, T, this.zoomU(T));
    L.alpha = P.alpha = 1;
    if (T > 29.3) {                                                // ... leaving the seed of the next world: the opening point returns
      const I = smoothstep(29.3, 29.6, T) * (1.6 + 0.9 * Math.sin((T - 29.3) * TAU * 0.85));
      P.pt(0, 0, 0, W[0] * I, W[1] * I, W[2] * I, 3, SH_SOFT);
    }
  }
  /* ---- particle forces & targets for every moment ---- */
  particleParams(T, U, au, g) {
    const cam = this.a.camera, E = cam.eye;
    U.explode = 0; U.freeze = 0; U.jitter = 0; U.collapse = 0; U.swirl = 0; U.repulse = 0; U.red = 0; U.blink = 0;
    U.xfOn = 0; U.streak = 0; U.mix = 0; U.cyan = 0.16; U.size = 1.6; U.noiseFreq = 0.6;
    U.force = 1 + au.bass * CONFIG.audio.bassForce;                          // BASS → particle force
    if (T < 8) {
      U.modeA = U.modeB = 0; U.center = [0, 0, -4]; U.axis = [0, 0, 1]; U.attract = 0.7; U.damp = 1.5; U.noise = 0.08;
      U.orbit = 0.1 + au.mid * CONFIG.audio.midOrbit * 0.15; U.refDist = 3;    // MID → orbital motion
      U.alpha = 0.42 * smoothstep(3.8, 5.6, T) + 0.3 * smoothstep(7.0, 7.6, T); U.streak = 0.5 * seg(T, 7, 8);
    } else if (T < 24) {
      U.center = [0, 0, 0]; U.axis = [0, 1, 0]; U.refDist = 8;
      if (T < 14) {
        U.modeA = U.modeB = 1; U.attract = 0.6; U.damp = 1.2; U.noise = 0.25; U.noiseFreq = 0.35;
        U.orbit = 0.25 + au.mid * CONFIG.audio.midOrbit * 0.4; U.alpha = 0.5 * smoothstep(8.2, 9.5, T);
      } else if (T < 16) {

/* ============================================================================

     world lines + points + GPU particles (additive, depth-tested so the

    this.sym = new SymbolEngine(makeRNG('symbols'));
    this.glitch = new GlitchEngine(r);
    this.camera = new CameraSystem(new Noise(makeRNG('camera')));
    this.text = new TextOverlaySystem();
    this.recursion = new RecursionEngine(this.geo);
    this.audio = new AudioEngine();
    this.react = new AudioReactiveSystem();
    this.timeline = new TimelineController(this);
    this.uiCam = { view: M4.identity(new Float32Array(16)), proj: new Float32Array(16) };
    this.tint = PAL.cyan.map((c, i) => c * 0.6 + PAL.gray[i] * 0.4);
    this.T = START_T; this.playing = false; this.started = false; this.hudOn = false;
    this.simAcc = 0; this.last = performance.now(); this.fps = 60; this.hudTick = 0;
    this.resize();
    addEventListener('resize', () => this.resize());
    this.frame = this.frame.bind(this);
    try {
      this.audioDone = Soundtrack.render()
        .then(b => { this.audio.buffer = b; this.audio.status = 'procedural ' + b.duration.toFixed(1) + 's'; if (this.playing) this.audio.play(this.T); })
        .catch(e => { this.audio.status = 'error: ' + e.message; });
    } catch (e) { this.audio.status = 'error: ' + e.message; this.audioDone = Promise.resolve(); }
    addEventListener('keydown', e => this.key(e));

  }
  key(e) {
    if (e.repeat) return;
    const k = e.code;
    if (k === 'Space') e.preventDefault();
    if (k === 'KeyS') { this.toggleHud(); return; }
    if (!this.started) { if (k === 'Space' || k === 'Enter') this.start(); return; }
    if (k === 'Space') this.togglePause();
    else if (k === 'KeyR') { this.playing = true; document.body.classList.add('playing'); this.seek(0); }
    else if (k === 'KeyG') this.glitch.enabled = !this.glitch.enabled;
    else if (k === 'KeyA') this.react.enabled = !this.react.enabled;
    else if (k === 'KeyM') this.audio.setMuted(!this.audio.muted);
    else if (k === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {}); }

  start() {

  togglePause() {

  seek(T) {

  resize() {

      this.glitch.resize(1920, 1080);

  boot(t) {

  updateHud() {

  /** ?smoke=1 — in-browser self-test: renders key moments of the timeline and reports errors / black frames */
  runSmoke() {
    const gl = this.r.gl, w = this.W, h = this.H, buf = new Uint8Array(w * h * 4), out = [];
    const times = [0.6, 2.6, 3.8, 5.5, 6.95, 7.6, 9.5, 11.0, 13.2, 14.5, 15.7, 16.6, 17.6, 18.8, 19.77, 20.5, 21.6, 22.5, 23.4, 24.6, 26.2, 27.7, 28.5, 29.5, 29.95];
    this.started = true; this.playing = true;
    for (const t of times) {
      try {
        this.seek(Math.max(0, t - 0.1));
        for (let i = 1; i <= 6; i++) this.step(t - 0.1 + i * (0.1 / 6), 0.1 / 6);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        let sum = 0, lit = 0;
        for (let i = 0; i < buf.length; i += 4) { const l = (buf[i] + buf[i + 1] + buf[i + 2]) / 765; sum += l; if (l > 0.12) lit++; }
        const err = gl.getError(), lum = sum / (w * h);

    const head = 'WORLD.EXE SELF-TEST  ' + w + 'x' + h + '  ' + (this.r.hdr ? 'HDR' : '8-bit') + ' targets\n(t=0.6 is a tiny point and t=24.6 only a cursor: low "lit" there is expected)\n';
    this.hud.textContent = head + out.join('\n') + '\naudio: ' + this.audio.status;
    this.audioDone.then(() => { this.hud.textContent = head + out.join('\n') + '\naudio: ' + this.audio.status; });

  async runExport() {
    this.hud.className = 'on';

    try { await this.audioDone; } catch (e) {}
    const audioBuf = this.audio.buffer;
    if (!audioBuf) {
      this.hud.textContent = 'Error: audio buffer not available';
      return;
    }
    // 1. Export 44.1kHz 16-bit PCM WAV to server
    this.hud.textContent = 'Exporting soundtrack.wav...';
    const numCh = audioBuf.numberOfChannels, sr = audioBuf.sampleRate, len = audioBuf.length;
    const wavBuf = new ArrayBuffer(44 + len * numCh * 2);
    const view = new DataView(wavBuf);
    const writeStr = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
    writeStr(0, 'RIFF'); view.setUint32(4, 36 + len * numCh * 2, true);

    view.setUint32(24, sr, true); view.setUint32(28, sr * numCh * 2, true);
    view.setUint16(32, numCh * 2, true); view.setUint16(34, 16, true);

        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);

    CONFIG.quality = 'ultra';
    CONFIG.adaptiveQuality = false;
    this.W = 1920; this.H = 1080;
    this.canvas.width = 1920; this.canvas.height = 1080;
    this.camera.aspect = 1920 / 1080;
    this.glitch.resize(1920, 1080);
    M4.ortho(this.uiCam.proj, 0, 1920, 1080, 0, -10, 10);
    this.text.layout(1920, 1080);

    // 3. FFT helper and mock analyser for 100% deterministic audio reactivity
    const pcm = audioBuf.getChannelData(0);
    const totalFrames = Math.round(CONFIG.duration * 60);
    const dt = 1 / 60;
    const re = new Float32Array(2048), im = new Float32Array(2048);
    function fft(re, im) {
      const n = re.length;
      for (let i = 0, j = 0; i < n; i++) {
        if (j > i) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
        let m = n >> 1;
        while (m >= 1 && j >= m) { j -= m; m >>= 1; }
        j += m;

        const wStepR = Math.cos(ang), wStepI = Math.sin(ang);

          let wr = 1, wi = 0;
          for (let k = 0; k < half; k++) {
            const tr = wr * re[i + k + half] - wi * im[i + k + half];
            const ti = wr * im[i + k + half] + wi * re[i + k + half];
            re[i + k + half] = re[i + k] - tr;
            im[i + k + half] = im[i + k] - ti;
            re[i + k] += tr;
            im[i + k] += ti;
            const nwr = wr * wStepR - wi * wStepI;
            wi = wr * wStepI + wi * wStepR;
            wr = nwr;
          }
        }
      }
    }
    const mockAnalyser = {
      frequencyBinCount: 1024,
      fftSize: 2048,
      data: new Uint8Array(1024),
      getByteFrequencyData(d) { d.set(this.data); }
    };

    // 4. Initialize animation state
    this.started = true;
    this.playing = true;
    this.seek(0);

    const gl = this.r.gl;
    const pixelBuf = new Uint8Array(1920 * 1080 * 4);
    const t0 = performance.now();

    for (let f = 0; f < totalFrames; f++) {
      const T = f * dt;
      this.T = T;

      // Extract 2048 samples and compute frequency response
      const s0 = Math.min(Math.floor(T * sr), pcm.length - 2048);
      for (let i = 0; i < 2048; i++) {
        const w = 0.5 * (1 - Math.cos((2 * Math.PI * i) / 2047));
        re[i] = (pcm[s0 + i] || 0) * w;
        im[i] = 0;
      }
      fft(re, im);
      for (let i = 0; i < 1024; i++) {
        const mag = Math.sqrt(re[i] * re[i] + im[i] * im[i]) / 2048;
        const db = 20 * Math.log10(Math.max(mag, 1e-5));
        mockAnalyser.data[i] = Math.round(clamp01((db - (-100)) / ((-30) - (-100))) * 255);
      }
      this.react.update(dt, mockAnalyser, sr, true);

      // Render step
      this.step(T, dt);

      // Read uncompressed 1080p frame buffer
      gl.readPixels(0, 0, 1920, 1080, gl.RGBA, gl.UNSIGNED_BYTE, pixelBuf);

      // Stream to FFmpeg stdin via HTTP
      await fetch('/frame', {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: pixelBuf
      });

      if (f % 30 === 0 || f === totalFrames - 1) {
        const pct = ((f + 1) / totalFrames * 100).toFixed(1);
        const fps = ((f + 1) / ((performance.now() - t0) / 1000)).toFixed(1);
        this.hud.textContent = `WORLD.EXE OFFLINE RENDERER (1080p 60fps)\nFrame ${f + 1} / ${totalFrames} (${pct}%) @ ${fps} fps\nStreaming to FFmpeg (ProRes 422 HQ)...`;
      }
    }

    this.hud.textContent = 'Rendering complete! Finishing FFmpeg encode...';
    await fetch('/done', { method: 'POST' });
  }
}

/* ---- boot / error reporting: initialisation and shader errors are shown on screen ---- */
function fatal(e) {
  const h = document.getElementById('hud');
  if (h.classList.contains('err')) return;
  const msg = String((e && e.message) || e), lines = msg.split('\n'), src = lines.filter(l => /^\s*\d+ {2}/.test(l));
  const m = /ERROR: \d+:(\d+)/.exec(msg), n = m ? Number(m[1]) : 0;
  h.className = 'err';
  h.textContent = 'WORLD.EXE could not start\n\n' + lines.filter(l => !/^\s*\d+ {2}/.test(l)).slice(0, 10).join('\n') +
    (n ? '\n…\n' + src.slice(Math.max(0, n - 2), n + 1).join('\n') : '') +
    '\n\nWebGL2 is required (current Chrome / Edge / Firefox / Safari 15+).';
  console.error(e);
}
addEventListener('error', ev => fatal(ev.error || ev.message));
let APP = null;
try {
  APP = new App();
  if (APP.smoke) APP.runSmoke();
  else if (APP.exporting) APP.runExport();
  else requestAnimationFrame(APP.frame);
} catch (e) { fatal(e); }
</script>
</body>
