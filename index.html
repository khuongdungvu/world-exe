<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WORLD.EXE — THE LAST RENDER</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body.playing { cursor: none; }
  #view { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; background: #000; }
  #hud {
    position: fixed; left: 14px; top: 12px; margin: 0; padding: 9px 12px;
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #a7b1af; background: rgba(0, 0, 0, .62); white-space: pre; pointer-events: none;
    display: none; letter-spacing: .02em; border-left: 1px solid #3d4b4a;
  }
  #hud.on { display: block; }
  #hud.err { display: block; color: #e0645a; border-left-color: #a33; }
  #file { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<pre id="hud"></pre>
<input id="file" type="file" accept="audio/*">
<script>
'use strict';
/* ============================================================================
   WORLD.EXE — THE LAST RENDER
   A 30-second procedural music video. Pure code.

   Every pixel and every sample is generated by this file: geometry, particles,
   typography (a dot-matrix font defined as bit patterns), post-processing,
   camera and the complete soundtrack (rendered offline with Web Audio).
   No textures, images, samples, models, libraries or network requests.

   FILE MAP
     0. CONFIG ................ the important tweakable parameters
     1. Core utilities ........ math, easing, seeded RNG, Perlin noise, mat4
     2. Renderer .............. WebGL2 helpers, LineBatch (instanced AA lines),
                                PointBatch, background sky shader
     3. ParticleEngine ........ GPU particles, transform-feedback simulation
     4. SacredGeometryEngine .. rings, polygons, recursive subdivisions
        ConstellationEngine ... nodes/edges; an anamorphic eye hides inside
        EyeGenerator .......... procedural iris / black-hole pupil shader
     5. LSystemWorldTree ...... stochastic parametric 3D L-system + turtle
        SymbolEngine .......... twelve procedurally invented glyphs
     6. GlitchEngine .......... bloom + 10-layer glitch/post chain
        CameraSystem .......... procedural cinematic camera
     7. Soundtrack ............ deterministic offline composition
        AudioEngine ........... playback / seeking / recording stream
        AudioReactiveSystem ... AnalyserNode → smoothed bass / mid / high
     8. TextOverlaySystem ..... dot-matrix typesetting
        RecursionEngine ....... self-similar infinite zoom-out
     9. TimelineController .... updateScene(time): the master score
    10. App ................... loop, input, resize, quality, recording, HUD
   ========================================================================== */

/* ============================================================================
   0. CONFIG
   ========================================================================== */
const CONFIG = {
  seed: 'THE-LAST-RENDER',     // master seed — every system derives from it (?seed=...)
  duration: 30.0,              // length of the film in seconds
  bpm: 120,                    // musical grid; visual events are quantised to it
  loop: true,                  // after the final cut, wait in black and run again
  loopBlack: 2.4,              // seconds of black before WORLD.EXE restarts
  quality: 'high',             // low | medium | high | ultra   (?q=...)
  adaptiveQuality: true,       // lower the render scale if the frame rate drops
  qualities: {
    low:    { scale: 0.62, maxDPR: 1.0,  particles: 8192 },
    medium: { scale: 0.80, maxDPR: 1.25, particles: 16384 },
    high:   { scale: 1.00, maxDPR: 1.5,  particles: 24576 },
    ultra:  { scale: 1.00, maxDPR: 2.0,  particles: 32768 },
  },
  bloom: { threshold: 0.34, knee: 0.30, strength: 0.95 },
  exposure: 1.55,              // tone-mapping exposure
  grain: 0.035,                // film grain amount
  vignette: 0.6,
  scanlines: 0.07,             // base CRT scanline amount (glitch adds more)
  glitchMaster: 1.0,           // multiplier on the whole GlitchEngine (G toggles)
  lineWidth: 1.0,              // global line width multiplier
  audio: {
    volume: 0.9,
    reactivity: 1.0,           // global multiplier on all audio → visual mappings
    attack: 22.0,              // exponential smoothing rate when a band rises (1/s)
    release: 5.5,              // exponential smoothing rate when a band falls (1/s)
    bands: { bass: [25, 150], mid: [150, 2000], high: [2000, 11000] },
    // BASS → camera shake, scale pulse, particle force
    bassShake: 0.016, bassScale: 0.035, bassForce: 0.9,
    // MID → geometry rotation, tree growth, orbital motion
    midRotation: 0.8, midGrowth: 0.35, midOrbit: 0.8,
    // HIGH → glitch, spark particles, line brightness
    highGlitch: 0.10, highSparks: 140, highBrightness: 0.45,
  },
  palette: {                   // sRGB; converted to linear light below
    bg:    [0.010, 0.011, 0.013],
    white: [0.93, 0.91, 0.86],   // off-white, like old phosphor / paper
    gray:  [0.56, 0.58, 0.58],
    cyan:  [0.43, 0.64, 0.63],   // dirty cyan
    red:   [0.93, 0.19, 0.13],   // warning red — used almost never
  },
};

/* URL overrides: ?seed=ABC  ?q=low|medium|high|ultra  ?t=12.5 (start time)
   ?still=1 (render one frame at t and stop — used for testing)  ?mute=1 */
const QS = new URLSearchParams(location.search);
if (QS.has('seed')) CONFIG.seed = QS.get('seed');
if (QS.has('q') && CONFIG.qualities[QS.get('q')]) CONFIG.quality = QS.get('q');
const START_T = QS.has('t') ? Math.max(0, parseFloat(QS.get('t')) || 0) : 0;
const STILL = QS.has('still');

/* ============================================================================
   1. CORE UTILITIES
   ========================================================================== */
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const clamp01 = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const smoothstep = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
/** local progress of t inside [a, b], clamped to 0..1 */
const seg = (t, a, b) => clamp01((t - a) / (b - a));
/** 1 inside [a,b] with smooth fade-in/out edges */
const pulse = (t, a, b, fi, fo) => smoothstep(a, a + fi, t) * (1 - smoothstep(b - fo, b, t));
const Ease = {
  inQuad: t => t * t,
  outQuad: t => t * (2 - t),
  inOutQuad: t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  inQuart: t => t * t * t * t,
  outQuart: t => 1 - Math.pow(1 - t, 4),
  inOutQuint: t => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};

/* ---- deterministic hashing / seeded random --------------------------------
   Everything random in this film comes from the master seed.  Systems take a
   forked RNG (makeRNG('tree') etc.) so adding randomness to one system never
   changes another.  Per-frame randomness (glitch) uses rand1(integer) which is
   a pure function of the timeline frame index — the same time always glitches
   the same way. */
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hash32(a) {
  a = (a ^ 61) ^ (a >>> 16); a = (a + (a << 3)) | 0; a ^= a >>> 4;
  a = Math.imul(a, 0x27d4eb2d); a ^= a >>> 15;
  return a >>> 0;
}
const SEED = hashStr(String(CONFIG.seed));
/** deterministic float in [0,1) from an integer (and optional salt) */
const rand1 = (n, salt = 0) => hash32((Math.floor(n) * 2654435761) ^ hash32(SEED + salt * 7919)) / 4294967296;

class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 0x9e3779b9; }
  next() { // mulberry32
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(a, b) { return a + Math.floor(this.next() * (b - a + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  sign() { return this.next() < 0.5 ? -1 : 1; }
  gauss() { let u = 0; while (u === 0) u = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * this.next()); }
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(this.next() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
}
const makeRNG = label => new RNG(hash32(SEED ^ hashStr(label)));

/* ---- Perlin "improved" noise (seeded permutation) -------------------------- */
class Noise {
  constructor(rng) {
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(rng.next() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    this.P = new Uint8Array(512);
    for (let i = 0; i < 512; i++) this.P[i] = p[i & 255];
  }
  static fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  static grad(h, x, y, z) {
    const u = h < 8 ? x : y, v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
    return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
  }
  noise3(x, y, z) {
    const P = this.P;
    let X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z);
    x -= X; y -= Y; z -= Z; X &= 255; Y &= 255; Z &= 255;
    const u = Noise.fade(x), v = Noise.fade(y), w = Noise.fade(z), g = Noise.grad;
    const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
    return lerp(
      lerp(lerp(g(P[AA] & 15, x, y, z), g(P[BA] & 15, x - 1, y, z), u),
           lerp(g(P[AB] & 15, x, y - 1, z), g(P[BB] & 15, x - 1, y - 1, z), u), v),
      lerp(lerp(g(P[AA + 1] & 15, x, y, z - 1), g(P[BA + 1] & 15, x - 1, y, z - 1), u),
           lerp(g(P[AB + 1] & 15, x, y - 1, z - 1), g(P[BB + 1] & 15, x - 1, y - 1, z - 1), u), v), w);
  }
  n1(x, salt = 0) { return this.noise3(x, salt * 1.731 + 0.37, salt * 0.917 + 0.71); }
}

/* ---- tiny vec3 / mat4 (column-major, WebGL convention) --------------------- */
const V3 = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: a => Math.hypot(a[0], a[1], a[2]),
  norm: a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  /** rotate v around unit axis k by angle (Rodrigues) */
  rot: (v, k, ang) => {
    const c = Math.cos(ang), s = Math.sin(ang), d = k[0] * v[0] + k[1] * v[1] + k[2] * v[2];
    const cx = k[1] * v[2] - k[2] * v[1], cy = k[2] * v[0] - k[0] * v[2], cz = k[0] * v[1] - k[1] * v[0];
    return [v[0] * c + cx * s + k[0] * d * (1 - c), v[1] * c + cy * s + k[1] * d * (1 - c), v[2] * c + cz * s + k[2] * d * (1 - c)];
  },
};
const M4 = {
  perspective(out, fovy, aspect, near, far) {
    const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
    out.fill(0); out[0] = f / aspect; out[5] = f; out[10] = (far + near) * nf; out[11] = -1; out[14] = 2 * far * near * nf;
    return out;
  },
  ortho(out, l, r, b, t, n, f) {
    out.fill(0);
    out[0] = 2 / (r - l); out[5] = 2 / (t - b); out[10] = -2 / (f - n);
    out[12] = -(r + l) / (r - l); out[13] = -(t + b) / (t - b); out[14] = -(f + n) / (f - n); out[15] = 1;
    return out;
  },
  identity(out) { out.fill(0); out[0] = out[5] = out[10] = out[15] = 1; return out; },
  /** view matrix + returns basis vectors (right, up, back) into `basis` */
  lookAt(out, eye, target, up, basis) {
    let zx = eye[0] - target[0], zy = eye[1] - target[1], zz = eye[2] - target[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
    out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
    out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
    out[12] = -(xx * eye[0] + xy * eye[1] + xz * eye[2]);
    out[13] = -(yx * eye[0] + yy * eye[1] + yz * eye[2]);
    out[14] = -(zx * eye[0] + zy * eye[1] + zz * eye[2]);
    out[15] = 1;
    if (basis) { basis.right = [xx, xy, xz]; basis.up = [yx, yy, yz]; basis.fwd = [-zx, -zy, -zz]; }
    return out;
  },
};

/* ---- palette in linear light ---------------------------------------------- */
const toLin = c => c.map(v => Math.pow(v, 2.2));
const PAL = {};
for (const k in CONFIG.palette) PAL[k] = toLin(CONFIG.palette[k]);

/* point sprite shapes */
const SH_SOFT = 0, SH_SQUARE = 1, SH_RING = 2, SH_GLINT = 3;

/* ============================================================================
   2. RENDERER
   WebGL2 with half-float HDR render targets (EXT_color_buffer_float) when the
   GPU allows it.  Scene drawing is additive *light* on near-black: lines and
   points are emissive, so overlapping structure glows brighter — brightness
   becomes the compositional tool.  A depth buffer exists only so the eye's
   black-hole pupil can occlude what lies behind it.
   ========================================================================== */
const GLSL_HASH = `
float h11(float n){ return fract(sin(n * 127.1) * 43758.5453123); }
float h21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float h31(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
vec3 h33(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), u.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), u.x), u.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), u.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), u.x), u.y), u.z);
}
`;

const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUv = p;
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

class Renderer {
  constructor(canvas) {
    const gl = canvas.getContext('webgl2', {
      antialias: false, alpha: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance',
    });
    if (!gl) throw new Error('WebGL2 is not available in this browser.');
    this.gl = gl;
    this.canvas = canvas;
    this.hdr = !!gl.getExtension('EXT_color_buffer_float');
    this.maxPoint = (gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE) || [1, 64])[1];
    this.emptyVAO = gl.createVertexArray();
    this.lost = false;
    canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); this.lost = true; });
  }
  shader(type, src) {
    const gl = this.gl, s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(s);
      const numbered = src.split('\n').map((l, i) => String(i + 1).padStart(4) + '  ' + l).join('\n');
      throw new Error('Shader compile error:\n' + log + '\n' + numbered);
    }
    return s;
  }
  /** compile + link; returns { p, u } where u maps uniform name → location */
  program(vs, fs, tfVaryings) {
    const gl = this.gl, p = gl.createProgram();
    gl.attachShader(p, this.shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, this.shader(gl.FRAGMENT_SHADER, fs));
    if (tfVaryings) gl.transformFeedbackVaryings(p, tfVaryings, gl.INTERLEAVED_ATTRIBS);
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('Program link error: ' + gl.getProgramInfoLog(p));
    const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) {
      const info = gl.getActiveUniform(p, i);
      u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
    }
    return { p, u };
  }
  /** render target: colour texture (+ optional depth renderbuffer) */
  target(w, h, opt = {}) {
    const gl = this.gl;
    const rt = {
      w: 0, h: 0, tex: gl.createTexture(), fbo: gl.createFramebuffer(),
      depth: opt.depth ? gl.createRenderbuffer() : null,
      hdr: opt.hdr !== false && this.hdr, linear: opt.linear !== false,
    };
    this.resizeTarget(rt, w, h);
    return rt;
  }
  resizeTarget(rt, w, h) {
    const gl = this.gl;
    w = Math.max(1, w | 0); h = Math.max(1, h | 0);
    if (rt.w === w && rt.h === h) return;
    rt.w = w; rt.h = h;
    gl.bindTexture(gl.TEXTURE_2D, rt.tex);
    if (rt.hdr) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const f = rt.linear ? gl.LINEAR : gl.NEAREST;
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rt.tex, 0);
    if (rt.depth) {
      gl.bindRenderbuffer(gl.RENDERBUFFER, rt.depth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rt.depth);
    }
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE && rt.hdr) {
      rt.hdr = false; rt.w = 0; // fall back to 8-bit
      this.resizeTarget(rt, w, h);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  bind(rt) {
    const gl = this.gl;
    if (rt) { gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo); gl.viewport(0, 0, rt.w, rt.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.canvas.width, this.canvas.height); }
  }
  fullscreen() { const gl = this.gl; gl.bindVertexArray(this.emptyVAO); gl.drawArrays(gl.TRIANGLES, 0, 3); }
}

/* ---- LineBatch ----------------------------------------------------------
   Every line in the film goes through here.  Each segment is one instance of
   a 4-vertex strip that the vertex shader expands in *screen space* around
   the projected segment, so widths are exact in pixels (optionally scaled by
   perspective), sub-pixel lines fade instead of aliasing, and segments that
   cross the near plane are clipped in view space.  The fragment shader uses
   linear AA ramps along the segment so chained polylines join seamlessly.

   CPU side: systems push segments in their own local coordinates; the batch
   applies a current affine transform (3 axes + origin) — this is how the same
   geometry code draws the mandala, the eye halo and the nested worlds.
   It also hosts the "random geometry corruption" glitch layer.          */
const LINE_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aCorner;
layout(location=1) in vec3 aP0;
layout(location=2) in vec3 aP1;
layout(location=3) in vec4 aCol;
layout(location=4) in vec2 aW;
uniform mat4 uView, uProj;
uniform vec2 uRes;
uniform float uPx, uPersp, uRefDist, uNear, uWidth;
out vec4 vCol;
out vec2 vLocal;
out float vLen, vHalf, vSoft;
void main(){
  vec4 v0 = uView * vec4(aP0, 1.0);
  vec4 v1 = uView * vec4(aP1, 1.0);
  float nz = -uNear;
  vCol = vec4(0.0); vLocal = vec2(0.0); vLen = 0.0; vHalf = 0.0; vSoft = 0.0;
  if (v0.z > nz && v1.z > nz) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); return; }
  if (v0.z > nz) v0 = mix(v0, v1, (v0.z - nz) / (v0.z - v1.z));
  if (v1.z > nz) v1 = mix(v1, v0, (v1.z - nz) / (v1.z - v0.z));
  vec4 c0 = uProj * v0, c1 = uProj * v1;
  vec2 s0 = c0.xy / c0.w * 0.5 * uRes;
  vec2 s1 = c1.xy / c1.w * 0.5 * uRes;
  vec2 d = s1 - s0;
  float len = length(d);
  vec2 dir = len > 1e-5 ? d / len : vec2(1.0, 0.0);
  vec2 nrm = vec2(-dir.y, dir.x);
  float k0 = 1.0, k1 = 1.0;
  if (uPersp > 0.5) { k0 = clamp(uRefDist / -v0.z, 0.3, 14.0); k1 = clamp(uRefDist / -v1.z, 0.3, 14.0); }
  float w = aW.x * uWidth * uPx * mix(k0, k1, aCorner.x);
  float bright = 1.0;
  if (w < 1.0) { bright = max(w, 0.0); w = 1.0; }
  float soft = aW.y;
  float hw = w * 0.5 * (1.0 + soft * 2.5);
  float ext = hw + 1.0;
  float along = mix(-1.0, len + 1.0, aCorner.x);
  vec2 sp = s0 + dir * along + nrm * aCorner.y * ext;
  float t = clamp(along / max(len, 1e-5), 0.0, 1.0);
  float z = mix(c0.z / c0.w, c1.z / c1.w, t);
  gl_Position = vec4(sp / (0.5 * uRes), clamp(z, -1.0, 1.0), 1.0);
  vCol = vec4(aCol.rgb * aCol.a * bright / (1.0 + soft * 1.5), 1.0);
  vLocal = vec2(along, aCorner.y * ext);
  vLen = len;
  vHalf = w * 0.5;
  vSoft = soft;
}`;
const LINE_FS = `#version 300 es
precision highp float;
in vec4 vCol; in vec2 vLocal; in float vLen, vHalf, vSoft;
out vec4 o;
void main(){
  float a = clamp(vLocal.x + 0.5, 0.0, 1.0) * clamp(vLen - vLocal.x + 0.5, 0.0, 1.0);
  float d = abs(vLocal.y);
  float crisp = clamp(vHalf + 0.5 - d, 0.0, 1.0);
  float hs = vHalf * (1.0 + vSoft * 2.5);
  float soft = exp(-d * d / max(hs * hs * 0.35, 0.2));
  o = vec4(vCol.rgb * a * mix(crisp, soft, vSoft), 1.0);
}`;

class LineBatch {
  constructor(r, capacity) {
    const gl = r.gl;
    this.r = r; this.cap = capacity; this.n = 0;
    this.data = new Float32Array(capacity * 12);
    this.prog = r.program(LINE_VS, LINE_FS);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    const corner = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, corner);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, -1, 0, 1, 1, -1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    const at = (loc, size, off) => {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 48, off);
      gl.vertexAttribDivisor(loc, 1);
    };
    at(1, 3, 0); at(2, 3, 12); at(3, 4, 24); at(4, 2, 40);
    gl.bindVertexArray(null);
    this.m = new Float64Array(12);
    this.resetXform();
    this.alpha = 1;          // global intensity multiplier for subsequent pushes
    this.corrupt = 0;        // 0..1 geometry corruption (GlitchEngine layer 6)
    this.corruptScale = 0.1; // world-space size of corruption offsets
    this.seed = 0;
    this.total = 0;          // stats
  }
  resetXform() { this.m.set([1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0]); }
  /** local→world: p = o + X*x + Y*y + Z*z */
  setXform(o, X, Y, Z) {
    const m = this.m;
    m[0] = X[0]; m[1] = X[1]; m[2] = X[2]; m[3] = Y[0]; m[4] = Y[1]; m[5] = Y[2];
    m[6] = Z[0]; m[7] = Z[1]; m[8] = Z[2]; m[9] = o[0]; m[10] = o[1]; m[11] = o[2];
  }
  /** 2D similarity in the z=0 plane: translate, uniform scale, rotate */
  setXform2D(tx, ty, s, ang, tz = 0) {
    const c = Math.cos(ang) * s, sn = Math.sin(ang) * s;
    this.m.set([c, sn, 0, -sn, c, 0, 0, 0, s, tx, ty, tz]);
  }
  seg(x0, y0, z0, x1, y1, z1, r, g, b, w = 1, soft = 0) {
    if (this.n >= this.cap) return;
    const m = this.m;
    let X0 = m[0] * x0 + m[3] * y0 + m[6] * z0 + m[9];
    let Y0 = m[1] * x0 + m[4] * y0 + m[7] * z0 + m[10];
    let Z0 = m[2] * x0 + m[5] * y0 + m[8] * z0 + m[11];
    let X1 = m[0] * x1 + m[3] * y1 + m[6] * z1 + m[9];
    let Y1 = m[1] * x1 + m[4] * y1 + m[7] * z1 + m[10];
    let Z1 = m[2] * x1 + m[5] * y1 + m[8] * z1 + m[11];
    if (this.corrupt > 0) {
      const h = hash32((this.n * 747796405 + this.seed) >>> 0) / 4294967296;
      if (h < this.corrupt * 0.2) {
        const h2 = hash32((this.n * 2891336453 + this.seed * 3) >>> 0) / 4294967296;
        const h3 = hash32((this.n * 1103515245 + this.seed * 7) >>> 0) / 4294967296;
        if (h2 < 0.25) return;                              // dropout
        if (h2 < 0.6) {                                     // spike: segment shoots outward
          const k = 1 + h3 * 9;
          X1 = X0 + (X1 - X0) * k; Y1 = Y0 + (Y1 - Y0) * k; Z1 = Z0 + (Z1 - Z0) * k;
        } else {                                            // displacement
          const s = this.corruptScale, ox = (h3 - 0.5) * s * 2, oy = (fract(h3 * 7.31) - 0.5) * s;
          X0 += ox; X1 += ox; Y0 += oy; Y1 += oy;
        }
        r *= 1.6; g *= 1.6; b *= 1.6;
      }
    }
    const d = this.data, o = this.n++ * 12;
    d[o] = X0; d[o + 1] = Y0; d[o + 2] = Z0; d[o + 3] = X1; d[o + 4] = Y1; d[o + 5] = Z1;
    d[o + 6] = r; d[o + 7] = g; d[o + 8] = b; d[o + 9] = this.alpha; d[o + 10] = w; d[o + 11] = soft;
  }
  /** polyline arc in local coordinates */
  arc(cx, cy, z, rad, a0, a1, segsFull, r, g, b, w = 1, soft = 0) {
    const n = Math.max(1, Math.ceil(segsFull * Math.abs(a1 - a0) / TAU));
    let px = cx + Math.cos(a0) * rad, py = cy + Math.sin(a0) * rad;
    for (let i = 1; i <= n; i++) {
      const a = a0 + (a1 - a0) * (i / n);
      const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad;
      this.seg(px, py, z, x, y, z, r, g, b, w, soft);
      px = x; py = y;
    }
  }
  flush(cam, res, opt) {
    if (!this.n) return;
    const gl = this.r.gl, P = this.prog, u = P.u;
    gl.useProgram(P.p);
    gl.uniformMatrix4fv(u.uView, false, cam.view);
    gl.uniformMatrix4fv(u.uProj, false, cam.proj);
    gl.uniform2f(u.uRes, res[0], res[1]);
    gl.uniform1f(u.uPx, opt.px);
    gl.uniform1f(u.uPersp, opt.persp ? 1 : 0);
    gl.uniform1f(u.uRefDist, opt.refDist || 1);
    gl.uniform1f(u.uNear, opt.near || 0.02);
    gl.uniform1f(u.uWidth, CONFIG.lineWidth);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * 12);
    gl.bindVertexArray(this.vao);
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, this.n);
    gl.bindVertexArray(null);
    this.total += this.n;
    this.n = 0;
  }
}

/* ---- PointBatch -------------------------------------------------------------
   CPU-built point sprites (constellation stars, tree neurons, text pixels…).
   Shapes: soft disc, square (dot-matrix text), ring, star-chart glint. */
const POINT_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec4 aCol;
layout(location=2) in vec2 aSz;
uniform mat4 uView, uProj;
uniform float uPx, uPersp, uRefDist, uNear, uMax;
out vec3 vCol;
out float vShape, vSize, vPad;
void main(){
  vec4 v = uView * vec4(aPos, 1.0);
  vCol = vec3(0.0); vShape = aSz.y; vSize = 0.0; vPad = 0.0;
  if (-v.z < uNear) { gl_Position = vec4(0.0, 0.0, -2.0, 1.0); gl_PointSize = 0.0; return; }
  gl_Position = uProj * v;
  float k = uPersp > 0.5 ? clamp(uRefDist / -v.z, 0.25, 14.0) : 1.0;
  float s = aSz.x * uPx * k;
  float b = 1.0;
  float minS = aSz.y > 0.5 && aSz.y < 1.5 ? 1.0 : 1.4;
  if (s < minS) { b = s / minS; s = minS; }
  float pad = (aSz.y > 0.5 && aSz.y < 1.5) ? 0.0 : 2.0;
  s = min(s, uMax - pad);
  vSize = s; vPad = pad;
  gl_PointSize = s + pad;
  vCol = aCol.rgb * aCol.a * b;
}`;
const POINT_FS = `#version 300 es
precision highp float;
in vec3 vCol; in float vShape, vSize, vPad;
out vec4 o;
void main(){
  vec2 p = (gl_PointCoord - 0.5) * (vSize + vPad);
  float r = vSize * 0.5, a;
  if (vShape < 0.5) {               // soft disc with a faint halo
    float d = length(p);
    a = clamp(r + 0.5 - d, 0.0, 1.0) * 0.8 + exp(-d * d / max(r * r * 1.4, 0.35)) * 0.32;
  } else if (vShape < 1.5) {        // square "pixel"
    vec2 q = abs(p);
    a = clamp(r + 0.5 - q.x, 0.0, 1.0) * clamp(r + 0.5 - q.y, 0.0, 1.0);
  } else if (vShape < 2.5) {        // thin ring
    float d = length(p);
    a = clamp(1.0 - abs(d - (r - 1.0)), 0.0, 1.0) * 0.9;
  } else {                          // glint: core + diffraction cross
    float d = length(p);
    float cross = (clamp(0.9 - abs(p.x), 0.0, 1.0) + clamp(0.9 - abs(p.y), 0.0, 1.0)) * clamp(1.0 - d / r, 0.0, 1.0);
    a = clamp(r * 0.28 + 0.5 - d, 0.0, 1.0) + cross * 0.7 + exp(-d * d / max(r * r * 0.08, 0.3)) * 0.4;
  }
  o = vec4(vCol * a, 1.0);
}`;

class PointBatch {
  constructor(r, capacity) {
    const gl = r.gl;
    this.r = r; this.cap = capacity; this.n = 0;
    this.data = new Float32Array(capacity * 9);
    this.prog = r.program(POINT_VS, POINT_FS);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    this.buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 36, 0);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 36, 12);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 2, gl.FLOAT, false, 36, 28);
    gl.bindVertexArray(null);
    this.m = new Float64Array(12);
    this.resetXform();
    this.alpha = 1; this.corrupt = 0; this.corruptScale = 0.1; this.seed = 0; this.total = 0;
    this.sizeScale = 1;      // multiplies sizes (used by the recursion LOD)
  }
  resetXform() { this.m.set([1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0]); }
  setXform(o, X, Y, Z) { LineBatch.prototype.setXform.call(this, o, X, Y, Z); }
  setXform2D(tx, ty, s, ang, tz = 0) { LineBatch.prototype.setXform2D.call(this, tx, ty, s, ang, tz); }
  pt(x, y, z, r, g, b, size, shape = SH_SOFT) {
    if (this.n >= this.cap) return;
    const m = this.m;
    let X = m[0] * x + m[3] * y + m[6] * z + m[9];
    let Y = m[1] * x + m[4] * y + m[7] * z + m[10];
    const Z = m[2] * x + m[5] * y + m[8] * z + m[11];
    if (this.corrupt > 0) {
      const h = hash32((this.n * 747796405 + this.seed) >>> 0) / 4294967296;
      if (h < this.corrupt * 0.25) {
        const h2 = hash32((this.n * 2891336453 + this.seed) >>> 0) / 4294967296;
        if (h2 < 0.3) return;
        X += (h2 - 0.5) * this.corruptScale * 3; Y += (fract(h2 * 9.17) - 0.5) * this.corruptScale;
        size *= 1 + h2 * 2;
      }
    }
    const d = this.data, o = this.n++ * 9;
    d[o] = X; d[o + 1] = Y; d[o + 2] = Z;
    d[o + 3] = r; d[o + 4] = g; d[o + 5] = b; d[o + 6] = this.alpha;
    d[o + 7] = size * this.sizeScale; d[o + 8] = shape;
  }
  flush(cam, res, opt) {
    if (!this.n) return;
    const gl = this.r.gl, P = this.prog, u = P.u;
    gl.useProgram(P.p);
    gl.uniformMatrix4fv(u.uView, false, cam.view);
    gl.uniformMatrix4fv(u.uProj, false, cam.proj);
    gl.uniform1f(u.uPx, opt.px);
    gl.uniform1f(u.uPersp, opt.persp ? 1 : 0);
    gl.uniform1f(u.uRefDist, opt.refDist || 1);
    gl.uniform1f(u.uNear, opt.near || 0.02);
    gl.uniform1f(u.uMax, Math.min(this.r.maxPoint, 256));
    gl.bindBuffer(gl.ARRAY_BUFFER, this.buf);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.n * 9);
    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.POINTS, 0, this.n);
    gl.bindVertexArray(null);
    this.total += this.n;
    this.n = 0;
  }
}

/* ---- Background: near-black void with an optional procedural sky ----------
   The nebula is evaluated on the *view direction* (a sky sphere), so it
   parallaxes correctly as the camera turns.  It is kept at a few percent of
   brightness: darkness is the canvas. */
const BG_FS = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 o;
uniform vec3 uBg, uRight, uUp, uFwd, uTint;
uniform float uTan, uAspect, uNebula, uTime;
${GLSL_HASH}
float fbm(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ s += a * vnoise(p); p = p * 2.07 + 11.3; a *= 0.5; } return s; }
void main(){
  vec2 ndc = vUv * 2.0 - 1.0;
  vec3 c = uBg * (1.0 - 0.35 * dot(ndc, ndc));
  if (uNebula > 0.0005) {
    vec3 dir = normalize(uRight * ndc.x * uTan * uAspect + uUp * ndc.y * uTan + uFwd);
    float n = fbm(dir * 2.3 + vec3(0.0, uTime * 0.008, 0.0));
    float m = fbm(dir * 6.1 - 4.7);
    float cloud = pow(clamp(n * 1.25 - 0.28, 0.0, 1.0), 3.0) * (0.55 + 0.9 * m);
    float lanes = smoothstep(0.42, 0.62, m) * 0.6;   // dark dust lanes
    c += uTint * cloud * (1.0 - lanes) * uNebula;
  }
  o = vec4(c, 1.0);
}`;
/* ============================================================================
   3. PARTICLE ENGINE  (GPU, WebGL2 transform feedback)
   State per particle: position.xyz + brightness, velocity.xyz + age, plus a
   static random vec4.  Each simulation step is one draw call with the
   rasterizer disabled: the vertex shader integrates forces and writes the new
   state into the other buffer (ping-pong).

   Forces:  attraction (spring toward a procedural target shape), repulsion
            (inverse-square), orbit (tangential around an axis), collapse
            (radial pull + swirl), explosion (impulse), noise (divergence-free
            ABC-style flow field) and damping.
   Targets (computed in GLSL from the particle's random vector — no buffers):
            0 STARS  cosmic dust shell        3 CORE   collapsed singularity
            1 TREE   spores around the tree   4 EYE    iris fibres, limbus,
            2 LIFE   seven micro-organisms             accretion inflow, lids
                                              5 WORLD  rings of a reborn world
   Two targets can be cross-faded with a per-particle stagger, which is how
   one shape morphs into the next.
   ========================================================================== */
const PARTICLE_UPDATE_VS = `#version 300 es
precision highp float;
layout(location=0) in vec4 aPos;
layout(location=1) in vec4 aVel;
layout(location=2) in vec4 aRnd;
out vec4 oPos;
out vec4 oVel;
uniform float uDt, uTime;
uniform int uModeA, uModeB;
uniform float uMix, uAttract, uDamp, uNoise, uNoiseFreq, uOrbit, uCollapse, uSwirl, uExplode, uFreeze, uJitter, uForce;
uniform float uRepulse;
uniform vec3 uCenter, uAxis, uRepPos;
uniform vec3 uFO, uFX, uFY, uFZ;
uniform vec4 uLife[7];
uniform float uBlink, uIrisR, uPupilR;
const float TAU = 6.28318530718;
const float RR[8] = float[8](0.0, 0.16, 0.25, 0.38, 0.5, 0.63, 0.79, 1.0);
${GLSL_HASH}

vec3 flow(vec3 p, float t){
  vec3 a = vec3(sin(p.y * 1.7 + t) + cos(p.z * 1.3 - t * 0.7),
                sin(p.z * 1.5 + t * 0.8) + cos(p.x * 1.1 + t * 0.5),
                sin(p.x * 1.4 - t * 0.6) + cos(p.y * 1.2 + t * 0.9));
  p *= 2.3;
  return a + 0.5 * vec3(sin(p.y + t * 1.3), sin(p.z - t * 1.1), sin(p.x + t * 0.9));
}
vec3 frameP(vec2 q, float z){ return uFO + uFX * q.x + uFY * q.y + uFZ * z; }

vec3 tStars(vec4 r, out float b){
  float u = r.x * 2.0 - 1.0, th = r.y * TAU, s = sqrt(1.0 - u * u);
  b = 0.3 + 0.7 * r.w;
  return uCenter + vec3(s * cos(th), u, s * sin(th)) * mix(1.2, 9.0, pow(r.z, 0.7));
}
vec3 tTree(vec4 r, out float b){
  float y = mix(-3.0, 12.0, pow(r.x, 0.85));
  float crown = smoothstep(2.0, 6.0, y) * (1.0 - smoothstep(10.0, 12.5, y));
  float rad = 0.4 + pow(r.y, 0.6) * (1.5 + 6.5 * crown);
  float a = r.z * TAU + uTime * (0.03 + 0.07 * r.w);
  b = 0.2 + 0.8 * r.w * r.w;
  return uCenter + vec3(cos(a) * rad, y, sin(a) * rad);
}
vec3 tLife(vec4 r, out float b){
  int k = int(min(floor(r.x * 7.0), 6.0));
  vec4 L = uLife[k];
  float u = fract(r.x * 7.0), v = r.y, w = r.z, t = uTime, fk = float(k);
  float sz = L.z * (1.0 + 0.07 * sin(t * 2.3 + fk * 1.7));
  int type = int(L.w + 0.5);
  vec2 q;
  b = 0.6;
  float rot = t * (0.18 + 0.07 * fk) * (mod(fk, 2.0) < 0.5 ? 1.0 : -1.0);
  if (type == 0) {            // radiolarian: shell, radial spines, inner lattice
    if (u < 0.45) { float a = u / 0.45 * TAU; q = vec2(cos(a), sin(a)) * (1.0 + 0.03 * sin(a * 12.0 + t * 3.0)); b = 0.9; }
    else if (u < 0.85) { float j = floor(v * 18.0); float a = j / 18.0 * TAU + 0.02 * (w - 0.5); float l = (u - 0.45) / 0.4;
      q = vec2(cos(a), sin(a)) * (1.0 + l * (0.45 + 0.55 * h11(j + 3.0))); b = 0.75 * (1.0 - l * 0.6); }
    else { float a = v * TAU; q = vec2(cos(a), sin(a)) * 0.55 * sqrt(w); b = 0.4; }
  } else if (type == 1) {     // phyllotaxis disc (sunflower lattice)
    float a = u * 600.0 * 2.39996323;
    q = vec2(cos(a), sin(a)) * sqrt(u) * 1.1; b = 0.45 + 0.55 * (1.0 - u);
  } else if (type == 2) {     // cell: breathing membrane, nucleus, cytoplasm
    if (u < 0.5) { float a = u * 2.0 * TAU; float rr = 1.0 + 0.10 * sin(3.0 * a + t * 1.7) + 0.05 * sin(5.0 * a - t * 2.3);
      q = vec2(cos(a), sin(a)) * rr; b = 0.9; }
    else if (u < 0.7) { float a = v * TAU; q = vec2(0.18, 0.08) + vec2(cos(a), sin(a)) * 0.28 * sqrt(w); b = 1.0; }
    else { float a = v * TAU; q = vec2(cos(a), sin(a)) * 0.85 * sqrt(w); b = 0.28; }
  } else if (type == 3) {     // two-armed logarithmic spiral
    float arm = step(0.5, v); float th = u * 9.0;
    float a = th + arm * 3.14159 + t * 0.5;
    q = vec2(cos(a), sin(a)) * min(0.08 * exp(0.28 * th), 1.25) + (vec2(w, fract(w * 7.3)) - 0.5) * 0.07;

    for (let i = 0; i < 12; i++) this.fig(7, P(R[7], i * TAU / 12), 7, P(R[7], ((i + 5) % 12) * TAU / 12), 3.42 + i * 0.022, 0.42, 0.4);
    // enneagram {9/2}
    for (let i = 0; i < 9; i++) this.fig(2, P(R[2], i * TAU / 9 + 0.3), 2, P(R[2], ((i + 2) % 9) * TAU / 9 + 0.3), 3.05 + i * 0.02, 0.3, 0.6);
    // inner annulus between rings 1 and 2
    for (let i = 0; i < 12; i++) {
      const a = P(R[1], i * TAU / 12), b = P(R[2], (i + 0.5) * TAU / 12), c = P(R[1], (i + 1) * TAU / 12);
      this.fig(1, a, 2, b, 3.0 + i * 0.02, 0.28, 0.5);
      this.fig(2, b, 1, c, 3.02 + i * 0.02, 0.28, 0.5);
    }
    // twelve spokes
    for (let i = 0; i < 12; i++) this.fig(3, P(R[0], i * TAU / 12), 3, P(R[3], i * TAU / 12), 3.55 + i * 0.012, 0.3, 0.36);
    // ties between hexagram vertices and the outer star (they stretch as rings counter-rotate)
    for (let i = 0; i < 6; i++) { const a = Math.PI / 2 + i * TAU / 6; this.fig(3, P(R[3], a), 7, P(R[7], a), 3.72 + i * 0.02, 0.35, 0.3, 1); }
  }
  buildNodes() {
    const map = new Map();
    this.nodes = [];

    for (const f of this.figs) {
      for (const e of [[f.k0, f.x0, f.y0], [f.k1, f.x1, f.y1]]) {
        const kk = key(e[0], e[1], e[2]);
        if (!map.has(kk)) { map.set(kk, this.nodes.length); this.nodes.push({ k: e[0], x: e[1], y: e[2], t: f.t0 }); }
        else { const n = this.nodes[map.get(kk)]; n.t = Math.min(n.t, f.t0); }

  }
  nodePos(i, t, out) {
    const n = this.nodes[i], a = this.ringAngle(n.k, t), c = Math.cos(a), s = Math.sin(a);
    out[0] = n.x * c - n.y * s; out[1] = n.x * s + n.y * c;
  }
  /** A: { alpha, figAlpha, ringAlpha(k), dissolve, scale, z, bright } */
  draw(L, P, t, A) {
    const al = A.alpha;
    if (al <= 0.002) return;
    for (let k = 0; k < 8; k++) {
      const ra = al * (A.ringAlpha ? A.ringAlpha(k) : 1);
      if (ra > 0.002) this.drawRing(L, P, k, t, ra, A);
    }
    const fa = al * (A.figAlpha === undefined ? 1 : A.figAlpha);
    if (fa <= 0.002) return;
    const S = A.scale || 1, z = A.z || 0;
    for (const f of this.figs) {
      const pr = Ease.inOutCubic(seg(t, f.t0, f.t0 + f.dur));
      if (pr <= 0) continue;
      if (A.dissolve > 0 && rand1(f.id, 3) < A.dissolve) continue;
      const a0 = this.ringAngle(f.k0, t), a1 = this.ringAngle(f.k1, t);
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      const x0 = (f.x0 * c0 - f.y0 * s0) * S, y0 = (f.x0 * s0 + f.y0 * c0) * S;
      let x1 = (f.x1 * c1 - f.y1 * s1) * S, y1 = (f.x1 * s1 + f.y1 * c1) * S;
      x1 = x0 + (x1 - x0) * pr; y1 = y0 + (y1 - y0) * pr;
      const C = f.col ? PAL.cyan : PAL.white;
      const I = fa * f.I * (A.bright || 1) * (1 + (1 - pr) * 1.6);
      L.seg(x0, y0, z, x1, y1, z, C[0] * I, C[1] * I, C[2] * I, 1.0);
      if (pr < 1) P.pt(x1, y1, z, C[0] * I * 2.2, C[1] * I * 2.2, C[2] * I * 2.2, 2.4, SH_SOFT);
    }
  }
  drawRing(L, P, k, t, al, A) {
    const g = this.rings[k], st = g.st, S = A.scale || 1, z = A.z || 0;
    const r = this.ringRadius(k, t) * S;
    if (r <= 1e-4) return;
    const frac = this.ringDraw(k, t);
    if (frac <= 0) return;
    const a0 = this.ringAngle(k, t), W = PAL.white, G = PAL.gray;
    const I = al * st.I * (A.bright || 1);
    const wr = W[0] * I, wg = W[1] * I, wb = W[2] * I;
    const segs = Math.max(48, Math.round(300 * r / S));
    if (st.solid) L.arc(0, 0, z, r, a0, a0 + TAU * frac, segs, wr, wg, wb, 1);
    if (st.double) L.arc(0, 0, z, r + st.double * S, a0, a0 + TAU * frac, segs, G[0] * I * 0.8, G[1] * I * 0.8, G[2] * I * 0.8, 0.8);
    const parts = (n, duty) => {
      for (let i = 0; i < n; i++) {
        const s0 = i / n; if (s0 >= frac) break;
        const s1 = Math.min(frac, s0 + duty / n);
        L.arc(0, 0, z, r, a0 + s0 * TAU, a0 + s1 * TAU, segs, wr, wg, wb, 1);
      }
    };
    if (st.dashes) parts(st.dashes, st.duty);
    if (st.arcs) parts(st.arcs, st.arcDuty);
    if (st.ticks) {
      for (let i = 0; i < st.ticks; i++) {
        const s0 = i / st.ticks; if (s0 >= frac) break;
        const major = st.major && i % st.major === 0;
        const len = st.tickLen * S * (major ? st.majorLen : 1) * st.tickDir;
        const a = a0 + s0 * TAU, c = Math.cos(a), s = Math.sin(a), m = major ? 1 : 0.55;
        L.seg(c * r, s * r, z, c * (r + len), s * (r + len), z, wr * m, wg * m, wb * m, 0.9);
      }
    }
    if (st.dotted) {
      for (let i = 0; i < st.dotted; i++) {
        const s0 = i / st.dotted; if (s0 >= frac) break;
        if (st.gaps && fract(s0 * st.gaps) > 0.86) continue;
        const a = a0 + s0 * TAU;
        P.pt(Math.cos(a) * r, Math.sin(a) * r, z, wr * 1.1, wg * 1.1, wb * 1.1, 1.7, SH_SOFT);
      }
    }
    if (st.markers) for (let i = 0; i < st.markers; i++) {
      const a = a0 + i / st.markers * TAU + Math.PI / 4;
      L.arc(Math.cos(a) * r, Math.sin(a) * r, z, 0.017 * S, 0, TAU, 18, wr, wg, wb, 1);
    }
    if (st.dots) for (let i = 0; i < st.dots; i++) {
      const a = a0 + i / st.dots * TAU;
      P.pt(Math.cos(a) * r, Math.sin(a) * r, z, wr * 1.6, wg * 1.6, wb * 1.6, 2.4, SH_SOFT);
    }
    if (st.bead) {
      const a = a0 * 2.6 + t * 0.9, b = al * 2.2;
      P.pt(Math.cos(a) * r, Math.sin(a) * r, z, W[0] * b, W[1] * b, W[2] * b, 3.4, SH_SOFT);
    }
  }
}

/* ============================================================================
   4b. CONSTELLATION ENGINE
   ~950 nodes (x, y, radius, brightness, phase …) and ~1500 candidate edges
   chosen by distance + probability.  The secret: every node has a slot in an
   *eye layout* (lids, creases, limbus, iris rings, fibres, pupil boundary,
   halo, camouflage stars), but nodes are placed in 3D as an ANAMORPHIC
   sculpture — scattered in depth with x,y scaled by (D - z) / D, so that only
   from the camera's exact viewpoint, with rotation 0, do they project onto
   the eye.  While the cloud is turned, it reads as a random 3D constellation;
   as the rapid rotation decelerates into alignment, the eye snaps into
   recognition.  It is never drawn as an eye — it emerges.
   ========================================================================== */
class ConstellationEngine {
  constructor(rng, geo) {
    this.geo = geo;
    const S = [];
    const add = (x, y, kind, size, b) => S.push({ x, y, kind, size, b });
    // kinds: 1 lid, 2 crease, 3 limbus, 4 iris ring, 5 pupil, 6 fibre, 7 corner, 8 halo, 9 star
    const h = 0.5, R = (1 + h * h) / (2 * h), c = R - h;
    for (let i = 0; i < 92; i++) {
      const x = -1 + 2 * (i + 0.5) / 92 + rng.range(-0.004, 0.004);
      const y = Math.sqrt(R * R - x * x) - c;
      add(x, y, 1, 1.5, 0.95); add(x, -y, 1, 1.4, 0.85);
    }
    for (let i = 0; i < 42; i++) { const x = -0.86 + 1.72 * (i + 0.5) / 42; add(x, 0.07 + 0.6 * Math.pow(1 - x * x, 0.85), 2, 1.1, 0.5); }
    for (let i = 0; i < 26; i++) { const x = -0.62 + 1.24 * (i + 0.5) / 26; add(x, -(0.1 + 0.5 * Math.pow(Math.max(0, 1 - (x / 0.75) ** 2), 0.9)), 2, 1.0, 0.4); }
    const ring = (r, n, kind, size, b, wob = 0, wf = 0) => {
      const off = rng.next() * TAU;
      for (let i = 0; i < n; i++) { const a = off + i / n * TAU, rr = r + wob * Math.sin(a * wf); add(Math.cos(a) * rr, Math.sin(a) * rr, kind, size, b); }
    };
    ring(0.42, 88, 3, 1.6, 1.0); ring(0.36, 60, 4, 1.1, 0.55); ring(0.27, 54, 4, 1.2, 0.7, 0.014, 9);
    ring(0.205, 36, 4, 1.0, 0.5); ring(0.16, 44, 5, 1.4, 1.0);
    for (let j = 0; j < 36; j++) {
      const a0 = j / 36 * TAU + rng.range(-0.03, 0.03);
      for (let s = 0; s < 5; s++) { const r = 0.185 + s * 0.052, a = a0 + 0.18 * (r - 0.185); add(Math.cos(a) * r, Math.sin(a) * r, 6, 0.9, 0.55); }
    }
    for (const sx of [-1, 1]) for (let i = 0; i < 7; i++) add(sx * (1.0 + rng.range(-0.04, 0.06)), rng.range(-0.035, 0.035), 7, 1.2, 0.7);
    for (let i = 0; i < 72; i++) { if (rng.next() < 0.2) continue; const a = i / 72 * TAU; add(Math.cos(a) * 1.32, Math.sin(a) * 1.32, 8, 1.2, 0.45); }
    for (let i = 0; i < 170; i++) {
      let x, y;
      do { x = rng.range(-1.95, 1.95); y = rng.range(-1.2, 1.2); } while (x * x + y * y < 0.04);
      const big = rng.next() < 0.12;
      add(x, y, 9, big ? 2.4 : 1.0 + rng.next(), big ? 1.5 : 0.3 + rng.next() * 0.5);
    }
    const N = this.N = S.length;
    this.ex = new Float32Array(N); this.ey = new Float32Array(N); this.ez = new Float32Array(N);
    this.size = new Float32Array(N); this.bright = new Float32Array(N); this.phase = new Float32Array(N);
    this.kind = new Uint8Array(N); this.birth = new Float32Array(N); this.depart = new Float32Array(N);
    this.travel = new Float32Array(N); this.g = new Int32Array(N).fill(-1); this.parent = new Int32Array(N).fill(-1);
    this.sx = new Float32Array(N); this.sy = new Float32Array(N); this.sz = new Float32Array(N); this.rr = new Float32Array(N);
    for (let i = 0; i < N; i++) {
      const s = S[i];
      this.ex[i] = s.x; this.ey[i] = s.y; this.size[i] = s.size; this.bright[i] = s.b; this.kind[i] = s.kind;
      this.ez[i] = (s.kind === 9 ? 1.35 : 1.0) * rng.range(-1, 1);
      this.phase[i] = rng.next() * TAU;
      const u = rng.next() * 2 - 1, th = rng.next() * TAU, q = Math.sqrt(1 - u * u);
      this.sx[i] = q * Math.cos(th); this.sy[i] = u; this.sz[i] = q * Math.sin(th);   // scatter direction
      this.rr[i] = rng.next();
    }
    // geometry vertices claim their nearest eye slot: the mandala *becomes* the constellation
    const free = new Uint8Array(N).fill(1), gp = [0, 0];
    const order = rng.shuffle([...Array(geo.nodes.length).keys()]);
    for (const gi of order) {
      geo.nodePos(gi, 4.0, gp);
      let best = -1, bd = 1e9;
      for (let i = 0; i < N; i++) {
        if (!free[i] || this.kind[i] === 9) continue;
        const dx = this.ex[i] - gp[0], dy = this.ey[i] - gp[1], d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      if (best < 0) continue;
      free[best] = 0; this.g[best] = gi;
      this.birth[best] = clamp(geo.nodes[gi].t + 0.32, 3.45, 3.98);
      this.depart[best] = 4.0 + rng.next() * 0.55;
      this.travel[best] = 0.85;
    }
    for (let i = 0; i < N; i++) {
      if (this.g[i] >= 0) continue;
      const u = rng.next();
      this.birth[i] = this.kind[i] === 9 ? 4.25 + 1.3 * u : 4.45 + 1.85 * Math.sqrt(u);
      this.depart[i] = this.birth[i];
      this.travel[i] = 0.6;
    }
    // parents: nearest earlier-born node (new stars are spawned out of old ones)
    this.order = [...Array(N).keys()].sort((a, b) => this.birth[a] - this.birth[b]);
    for (let oi = 0; oi < N; oi++) {
      const i = this.order[oi];
      if (this.g[i] >= 0) continue;
      let best = -1, bd = 1e9;
      for (let oj = 0; oj < oi; oj++) {
        const j = this.order[oj];
        const dx = this.ex[i] - this.ex[j], dy = this.ey[i] - this.ey[j], d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = j; }
      }
      this.parent[i] = best;
    }
    // candidate edges by distance and probability (degree-limited)
    const E = [], deg = new Uint8Array(N);
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const si = this.kind[i] === 9, sj = this.kind[j] === 9;
      if (si !== sj) continue;
      const dx = this.ex[i] - this.ex[j], dy = this.ey[i] - this.ey[j], d = Math.sqrt(dx * dx + dy * dy);
      const maxD = si ? 0.34 : 0.075;
      if (d > maxD) continue;
      const p = si ? 0.42 * (1 - d / maxD) : (d < 0.045 ? 0.9 : 0.45);
      if (rng.next() > p || deg[i] >= 4 || deg[j] >= 4) continue;
      deg[i]++; deg[j]++;
      E.push(i, j, si ? 0.55 : 1.0);
    }
    this.E = new Float32Array(E);
    this.px = new Float32Array(N); this.py = new Float32Array(N); this.pz = new Float32Array(N); this.al = new Float32Array(N);
    this._gp = [0, 0];
  }
  /** Space A: anamorphic placement.  P: { camD, theta, tilt, depth, scale, geoScale } */
  updateA(t, P) {
    const geo = this.geo, gp = this._gp;
    const ct = Math.cos(P.theta), st = Math.sin(P.theta), cx = Math.cos(P.tilt), sx = Math.sin(P.tilt);
    for (let oi = 0; oi < this.N; oi++) {
      const i = this.order[oi];
      const z = this.ez[i] * P.depth, k = (P.camD - z) / P.camD;
      const x = this.ex[i] * k * P.scale, y = this.ey[i] * k * P.scale;
      let X = x * ct + z * st, Z = -x * st + z * ct;
      const Y = y * cx - Z * sx; Z = y * sx + Z * cx;
      let Yf = Y;
      const d0 = this.depart[i], u = Ease.inOutCubic(seg(t, d0, d0 + this.travel[i]));
      if (u < 1) {
        let ox, oy, oz;
        if (this.g[i] >= 0) { geo.nodePos(this.g[i], t, gp); ox = gp[0] * P.geoScale; oy = gp[1] * P.geoScale; oz = 0; }
        else { const p = this.parent[i]; ox = this.px[p]; oy = this.py[p]; oz = this.pz[p]; }
        X = ox + (X - ox) * u; Yf = oy + (Y - oy) * u; Z = oz + (Z - oz) * u;
      }
      this.px[i] = X; this.py[i] = Yf; this.pz[i] = Z;
      this.al[i] = smoothstep(this.birth[i], this.birth[i] + 0.14, t);
    }
  }
  /** Space B: the constellation re-assembles as the giant eye in a world frame.
      F: {o,x,y,z} world vectors (x,y,z already scaled).  P: { open, form, scatter, jitter, depth, seed } */
  updateEye(t, F, P) {
    const o = F.o, X = F.x, Y = F.y, Z = F.z;
    for (let i = 0; i < this.N; i++) {
      const rad = Math.hypot(this.ex[i], this.ey[i]);
      const d0 = 0.22 * rad + 0.12 * this.rr[i];
      const u = Ease.outCubic(seg(P.form, d0, d0 + 0.5));
      let lx = this.ex[i] * u, ly = this.ey[i] * u * (this.kind[i] === 9 || this.kind[i] === 8 ? 1 : P.open);
      let lz = this.ez[i] * P.depth * u;
      if (P.scatter > 0) {
        const s = P.scatter * (0.4 + this.rr[i] * 1.2);
        lx += this.sx[i] * s; ly += this.sy[i] * s; lz += this.sz[i] * s;
      }
      if (P.jitter > 0) {
        const h = rand1(i * 7 + P.seed * 131, 5);
        if (h < P.jitter * 0.5) { lx += (h - 0.25) * P.jitter * 0.8; ly += (rand1(i, P.seed) - 0.5) * P.jitter * 0.3; }
      }
      this.px[i] = o[0] + X[0] * lx + Y[0] * ly + Z[0] * lz;
      this.py[i] = o[1] + X[1] * lx + Y[1] * ly + Z[1] * lz;
      this.pz[i] = o[2] + X[2] * lx + Y[2] * ly + Z[2] * lz;
      this.al[i] = smoothstep(0, 0.25, u);
    }
  }
  /** A: { alpha, bright, sizeMul } */
  drawNodes(P, t, A) {
    const W = PAL.white, C = PAL.cyan;
    for (let i = 0; i < this.N; i++) {
      const a = this.al[i] * A.alpha;
      if (a < 0.01) continue;
      const tw = 0.72 + 0.28 * Math.sin(this.phase[i] + t * (1.4 + (i % 7) * 0.45));
      const I = a * this.bright[i] * tw * A.bright;
      const kind = this.kind[i], col = kind === 4 || kind === 6 ? C : W;
      const glint = kind === 9 && this.size[i] > 2;
      P.pt(this.px[i], this.py[i], this.pz[i], col[0] * I, col[1] * I, col[2] * I,
        this.size[i] * A.sizeMul * (glint ? 3.4 : 1), glint ? SH_GLINT : SH_SOFT);
    }
  }
  /** A: { alpha, maxLen } */
  drawEdges(L, A) {
    const E = this.E, px = this.px, py = this.py, pz = this.pz, W = PAL.white, G = PAL.gray;
    for (let e = 0; e < E.length; e += 3) {
      const i = E[e], j = E[e + 1];
      let a = this.al[i] * this.al[j] * A.alpha * E[e + 2];
      if (a < 0.01) continue;
      const dx = px[j] - px[i], dy = py[j] - py[i], dz = pz[j] - pz[i];
      const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
      a *= 1 - smoothstep(A.maxLen * 0.5, A.maxLen, len);
      if (a < 0.01) continue;
      const C = E[e + 2] < 1 ? G : W, I = a * 0.3;
      L.seg(px[i], py[i], pz[i], px[j], py[j], pz[j], C[0] * I, C[1] * I, C[2] * I, 0.85);
    }
  }
  /** the network loses its topology: random connections, re-wired every frame */
  drawRandomEdges(L, count, alpha, seed) {
    const W = PAL.white, Cy = PAL.cyan;
    for (let k = 0; k < count; k++) {
      const i = Math.floor(rand1(seed * 1031 + k, 11) * this.N), j = Math.floor(rand1(seed * 977 + k * 3, 13) * this.N);
      const a = alpha * (0.3 + 0.7 * rand1(k, seed)), C = k % 5 === 0 ? Cy : W;
      L.seg(this.px[i], this.py[i], this.pz[i], this.px[j], this.py[j], this.pz[j], C[0] * a, C[1] * a, C[2] * a, 0.8);
    }
  }
}

/* ============================================================================
   4c. EYE GENERATOR
   The eye is assembled from layers: (1) this fragment shader on a world-space
   quad — periodic-noise iris fibres, crypts, collarette, engraved rings, a
   copper-plate hatched sclera, and a black-hole pupil (event horizon that
   occludes via depth, gravitational lensing + swirl of the iris near the
   horizon, a Doppler-asymmetric photon ring, accretion glow); (2) the
   constellation nodes in eye layout; (3) GPU particles on iris targets;
   (4) the halo: concentric rings, rays and triangles drawn by drawHalo().
   ========================================================================== */
const EYE_VS = `#version 300 es
precision highp float;
uniform mat4 uView, uProj;
uniform vec3 uC, uU, uV;
uniform vec2 uHalf;
uniform float uScale;
out vec2 vQ;
void main(){
  vec2 c = vec2(float(gl_VertexID & 1), float((gl_VertexID >> 1) & 1)) * 2.0 - 1.0;
  vec2 q = c * uHalf;
  vQ = q;
  gl_Position = uProj * uView * vec4(uC + (uU * q.x + uV * q.y) * uScale, 1.0);
}`;
const EYE_FS = `#version 300 es
precision highp float;
in vec2 vQ;
out vec4 o;
uniform float uTime, uOpen, uIrisR, uPupilR, uI, uRed, uGlitch, uHole, uSeed, uSclera;
uniform vec3 uWhite, uCyan, uRedC;
${GLSL_HASH}
const float TAU = 6.28318530718;
float pn(vec2 p, float P){            // value noise, periodic in x (seamless around the iris)

    const STR = [7, 5, 4, 3, 2, 2, 1, 1];
    const bright = A.bright || 1, wave = A.wave || -10;
    for (let i = 1; i < N; i++) {
      const n = nodes[i], pi = n.parent, p = nodes[pi];

      let x0 = dx[pi], y0 = dy[pi], z0 = dz[pi];
      let x1 = x0 + (dx[i] - x0) * f, y1 = y0 + (dy[i] - y0) * f, z1 = z0 + (dz[i] - z0) * f;
      let I = al * bright * (n.root ? 0.19 : 0.33 - n.depth * 0.024);

        y0 -= k * 1.6; y1 -= k * 1.9;

      const ns = n.root ? Math.max(1, STR[n.depth] - 2) : STR[n.depth];

            x1 + n.L[0] * c1 + n.U[0] * s1, y1 + n.L[1] * c1 + n.U[1] * s1, z1 + n.L[2] * c1 + n.U[2] * s1,

        } else P.pt(ex, ey, ez, W[0] * J * 0.9, W[1] * J * 0.9, W[2] * J * 0.9, 4.0, SH_RING);
      }
    }
    for (const o of this.orb) {
      const n = nodes[o.node];
      if (g < n.dist) continue;
      const pr = clamp01((m - o.th) / 0.4);
      if (pr <= 0) continue;
      const cx = dx[o.node], cy = dy[o.node], cz = dz[o.node], I = al * 0.16 * pr;
      let px = cx + o.ax1[0] * o.r, py = cy + o.ax1[1] * o.r, pz = cz + o.ax1[2] * o.r;
      for (let k = 1; k <= 28; k++) {
        const a = k / 28 * TAU * pr, c = Math.cos(a) * o.r, s = Math.sin(a) * o.r;
        const x = cx + o.ax1[0] * c + o.ax2[0] * s, y = cy + o.ax1[1] * c + o.ax2[1] * s, z = cz + o.ax1[2] * c + o.ax2[2] * s;
        L.seg(px, py, pz, x, y, z, G[0] * I, G[1] * I, G[2] * I, 0.7);
        px = x; py = y; pz = z;
      }
      for (let k = 0; k < o.planets; k++) {
        const a = o.ph + t * o.w + k * Math.PI, c = Math.cos(a) * o.r, s = Math.sin(a) * o.r, J = I * 5;

  drawSignals(L, P, A, g) {

}

/* ============================================================================
   5b. SYMBOL ENGINE — twelve glyphs invented by a small grammar
   base shape (circle, triangles, square, vesica piscis, crescent, hexagon…)
   + stem (vertical, foot-cross, arrow, horns, bar) + inner mark + satellites.
   They resemble alchemical / planetary signs without being any of them.
   ========================================================================== */
class SymbolEngine {
  constructor(rng) {
    this.glyphs = [];
    const seen = new Set();
    for (let guard = 0; this.glyphs.length < 12 && guard < 800; guard++) {
      const base = rng.pick(['circle', 'circle', 'tri', 'triDown', 'square', 'diamond', 'vesica', 'crescent', 'semi', 'hex', 'none']);
      const stem = rng.pick(['none', 'none', 'vert', 'cross', 'arrow', 'horns', 'foot', 'bar']);
      const inner = rng.pick(['none', 'dot', 'ring', 'hbar', 'tri', 'dots3', 'vbar']);
      const sat = rng.pick(['none', 'none', 'dots2', 'ticks', 'orbit']);
      if (base === 'none' && (stem === 'none' || inner === 'none')) continue;
      const sig = base + stem + inner + sat, shape = base + stem;
      if (seen.has(sig) || seen.has(shape)) continue;
      seen.add(sig); seen.add(shape);
      this.glyphs.push(this.build(base, stem, inner, sat));
    }
  }
  build(base, stem, inner, sat) {
    const S = [];
    const circ = (cx, cy, r, a0 = 0, a1 = TAU, n = 36) => { const s = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; s.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } S.push(s); };
    const poly = (n, r, rot) => { const s = []; for (let i = 0; i <= n; i++) { const a = rot + i * TAU / n; s.push([Math.cos(a) * r, Math.sin(a) * r]); } S.push(s); };
    const line = (x0, y0, x1, y1) => S.push([[x0, y0], [x1, y1]]);
    switch (base) {
      case 'circle': circ(0, 0, 0.62); break;
      case 'tri': poly(3, 0.72, Math.PI / 2); break;
      case 'triDown': poly(3, 0.72, -Math.PI / 2); break;
      case 'square': poly(4, 0.7, Math.PI / 4); break;
      case 'diamond': poly(4, 0.74, 0); break;
      case 'vesica': circ(-0.24, 0, 0.5); circ(0.24, 0, 0.5); break;
      case 'crescent': circ(0, 0, 0.62, Math.PI * 0.28, Math.PI * 1.72); circ(0.3, 0, 0.5, Math.PI * 0.47, Math.PI * 1.53); break;
      case 'semi': circ(0, -0.12, 0.62, 0, Math.PI); line(-0.62, -0.12, 0.62, -0.12); break;
      case 'hex': poly(6, 0.66, 0); break;
    }
    switch (stem) {
      case 'vert': line(0, -0.98, 0, 0.98); break;
      case 'cross': line(0, -0.62, 0, -1.02); line(-0.2, -0.84, 0.2, -0.84); break;
      case 'arrow': line(0.44, 0.44, 0.92, 0.92); line(0.92, 0.92, 0.58, 0.92); line(0.92, 0.92, 0.92, 0.58); break;
      case 'horns': circ(0, 0.98, 0.34, Math.PI * 1.08, Math.PI * 1.92, 18); break;
      case 'foot': line(-0.5, -0.98, 0.5, -0.98); line(0, -0.62, 0, -0.98); break;
      case 'bar': line(-0.98, 0, 0.98, 0); break;
    }
    switch (inner) {
      case 'dot': circ(0, 0, 0.07, 0, TAU, 10); break;
      case 'ring': circ(0, 0, 0.26); break;
      case 'hbar': line(-0.3, 0, 0.3, 0); break;
      case 'tri': poly(3, 0.26, Math.PI / 2); break;
      case 'dots3': for (let i = 0; i < 3; i++) { const a = Math.PI / 2 + i * TAU / 3; circ(Math.cos(a) * 0.26, Math.sin(a) * 0.26, 0.05, 0, TAU, 8); } break;
      case 'vbar': line(0, -0.3, 0, 0.3); break;
    }
    switch (sat) {
      case 'dots2': circ(-0.86, 0.76, 0.05, 0, TAU, 8); circ(0.86, 0.76, 0.05, 0, TAU, 8); break;
      case 'ticks': for (let i = 0; i < 8; i++) { const a = i * TAU / 8 + TAU / 16; line(Math.cos(a) * 0.84, Math.sin(a) * 0.84, Math.cos(a) * 0.98, Math.sin(a) * 0.98); } break;
      case 'orbit': circ(0, 0, 0.92, -0.45, 1.45, 24); break;
    }
    let len = 0;
    for (const s of S) for (let i = 1; i < s.length; i++) len += Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]);
    return { strokes: S, len };
  }
  drawGlyph(L, k, cx, cy, z, sz, pr, r, g, b, w = 1.1) {

    }
  }
  /** the wheel of twelve (local frame).  A: { alpha, R, size, ringPr, pr[12], pulse, rot, shatter, flicker, seed } */
  draw(L, P, t, A) {
    const al = A.alpha;
